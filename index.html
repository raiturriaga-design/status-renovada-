  "src/pages/tournaments.js": function(exports, require) {
const { pageHeading, teamMark, emptyState } = require("src/components/ui.js");
const { formatDate, localDateValue, escapeHtml } = require("src/utils/dom.js");
const { getTournamentStandings, TOURNAMENT_FORMATS } = require("src/domain/tournaments.js");
function renderTournaments(store, tournamentId = null) {
  if (tournamentId) {
    const tournament = store.tournaments.find(item => item.id === tournamentId);
    return tournament ? renderTournamentDetail(store, tournament) : `${pageHeading('COMPETICIÓN', 'Torneo no encontrado', 'No pudimos encontrar este torneo.')}${emptyState('No existe este torneo', 'Vuelve a la sección de torneos para continuar.', '<a class="button button-secondary" href="#tournaments">Ver torneos</a>')}`;
  }
  return renderTournamentIndex(store);
}

function renderTournamentIndex(store) {
  const form = store.teams.length >= 2 ? tournamentForm(store) : emptyState(
    'Agrega equipos para comenzar',
    'Los torneos usan los equipos y plantillas que ya registraste.',
    '<a class="button button-secondary" href="#teams">Ir a equipos</a>'
  );
  const tournaments = store.tournaments.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const cards = tournaments.length
    ? `<div class="tournament-list">${tournaments.map(tournament => tournamentCard(store, tournament)).join('')}</div>`
    : emptyState('Todavía no hay torneos', 'Crea una liga, un playoff, una eliminación directa o un cuadrangular.');

  return `${pageHeading('TEMPORADA · COMPETICIONES', 'Torneos', 'Organiza campeonatos y registra cada partido con las plantillas y estadísticas que ya tienes.')}
    <section class="tournament-intro"><div class="tournament-intro-copy"><span class="tournament-kicker">CENTRO DE COMPETICIONES</span><h2>Una temporada.<br><em>Todos los resultados.</em></h2><p>Elige el formato, arma el fixture y lleva cada encuentro en el tablero habitual.</p><div class="tournament-format-chips"><span>♜ Playoff</span><span>⚡ Eliminación directa</span><span>↻ Liga</span><span>▦ Cuadrangular</span></div></div><div class="tournament-intro-ball" aria-hidden="true">🏀</div></section>
    <div class="tournament-layout"><section class="card content-card tournament-create-card"><div class="section-header"><div><span class="eyebrow">NUEVO CAMPEONATO</span><h2>Configurar torneo</h2><p>Los partidos programados quedarán vinculados al torneo.</p></div><span class="tournament-step">01 <i>/</i> 03</span></div>${form}</section>
    <section class="card content-card tournament-list-card"><div class="section-header"><div><span class="eyebrow">TU TEMPORADA</span><h2>Torneos creados</h2><p>${tournaments.length} ${tournaments.length === 1 ? 'competición guardada' : 'competiciones guardadas'}.</p></div></div>${cards}</section></div>`;
}

function tournamentForm(store) {
  const formatCards = Object.entries(TOURNAMENT_FORMATS).map(([value, format]) => `<option value="${value}">${escapeHtml(format.label)} · ${escapeHtml(format.detail)}</option>`).join('');
  const choices = store.teams.slice().sort((a, b) => a.name.localeCompare(b.name, 'es')).map(team => `<label class="tournament-team-option"><input type="checkbox" name="teamIds" value="${team.id}"><span class="tournament-team-check" aria-hidden="true">✓</span>${teamMark(team, 'small-mark')}<span class="tournament-team-copy"><b>${escapeHtml(team.name)}</b><small>${escapeHtml(team.city)}</small></span></label>`).join('');
  return `<form class="form-grid tournament-form" data-form="tournament">
    <label class="field field-full"><span>Nombre del torneo</span><input name="name" required minlength="2" maxlength="60" placeholder="Ej. Copa Regional 2026"></label>
    <label class="field"><span>Formato de competencia</span><select name="format" required><option value="">Seleccionar formato</option>${formatCards}</select></label>
    <label class="field"><span>Fecha de inicio</span><input name="date" type="date" required value="${localDateValue()}"></label>
    <div class="field field-full"><span>Equipos participantes <small>Elige de 2 a 16 · cuadrangular requiere 4</small></span><div class="tournament-team-picker">${choices}</div></div>
    <div class="tournament-rules field-full"><span>✓ Usa los equipos y jugadores registrados</span><span>✓ Cada juego guarda estadísticas individuales</span><span>✓ Los promedios se actualizan al finalizar partidos</span></div>
    <div class="form-actions field-full"><button class="button button-primary" type="submit">Crear torneo <span>→</span></button></div><div class="form-message field-full" role="status"></div>
  </form>`;
}

function tournamentCard(store, tournament) {
  const matches = store.matches.filter(match => match.tournamentId === tournament.id);
  const complete = matches.filter(match => match.status === 'final').length;
  const live = matches.some(match => match.status === 'live');
  const label = statusText(tournament, live, matches);
  const format = TOURNAMENT_FORMATS[tournament.format]?.label || 'Torneo';
  const teams = tournament.teamIds.map(id => store.teams.find(team => team.id === id)).filter(Boolean);
  const champion = store.teams.find(team => team.id === tournament.championTeamId);
  return `<article class="tournament-card"><div class="tournament-card-top"><span class="tournament-format-badge">${escapeHtml(format)}</span><span class="tournament-status ${tournament.status === 'completed' ? 'is-complete' : live ? 'is-live' : ''}"><i></i>${label}</span></div><a class="tournament-card-title" href="#tournament/${tournament.id}">${escapeHtml(tournament.name)} <span>↗</span></a><div class="tournament-card-meta"><span>◷ ${formatDate(tournament.date)}</span><span>♙ ${teams.length} equipos</span><span>▣ ${complete}/${matches.length} partidos</span></div><div class="tournament-team-strip">${teams.slice(0, 6).map(team => teamMark(team, 'mini')).join('')}${teams.length > 6 ? `<small>+${teams.length - 6}</small>` : ''}</div>${champion ? `<div class="tournament-champion-line">🏆 Campeón: <b>${escapeHtml(champion.name)}</b></div>` : ''}<a class="tournament-card-link" href="#tournament/${tournament.id}">Abrir competición <span>→</span></a></article>`;
}

function statusText(tournament, live, matches) {
  if (tournament.status === 'completed') return 'Finalizado';
  if (live || matches.some(match => match.status === 'final')) return 'En marcha';
  return 'Programado';
}

function renderTournamentDetail(store, tournament) {
  const format = TOURNAMENT_FORMATS[tournament.format] || TOURNAMENT_FORMATS.league;
  const tournamentMatches = store.matches.filter(match => match.tournamentId === tournament.id);
  const complete = tournamentMatches.filter(match => match.status === 'final').length;
  const live = tournamentMatches.some(match => match.status === 'live');
  const champion = store.teams.find(team => team.id === tournament.championTeamId);
  const teams = tournament.teamIds.map(id => store.teams.find(team => team.id === id)).filter(Boolean);
  const standings = getTournamentStandings(tournament, store.matches, store.teams);
  const isRoundRobin = tournament.format === 'league' || tournament.format === 'quadrangular';
  const championPanel = champion ? `<div class="tournament-winner"><span>🏆</span><div><small>CAMPEÓN</small><b>${escapeHtml(champion.name)}</b></div></div>` : '';
  const rounds = tournament.rounds.map((round, index) => renderRound(store, tournament, round, index)).join('');
  const competition = isRoundRobin
    ? `<section class="card content-card"><div class="section-header"><div><span class="eyebrow">CLASIFICACIÓN · BASE FIBA</span><h2>${tournament.format === 'quadrangular' ? 'Grupo único' : 'Tabla de posiciones'}</h2><p>2 puntos por victoria y 1 por derrota. Desempates: duelos directos, diferencia y puntos anotados; un empate exacto se ordena por nombre.</p></div><span class="standings-live-tag">${complete} jugados</span></div>${renderStandings(store, standings)}</section>
      ${tournament.format === 'quadrangular' ? `<section class="card content-card"><div class="section-header"><div><span class="eyebrow">DEFINICIÓN</span><h2>Final</h2><p>Los dos primeros lugares disputan el título al cerrar la fase de grupo.</p></div></div>${rounds.split('<!--FINAL-ROUND-->')[1] || renderWaitingFinal()}</section><section class="card content-card"><div class="section-header"><div><span class="eyebrow">FASE REGULAR</span><h2>Jornadas</h2></div></div>${rounds.split('<!--FINAL-ROUND-->')[0]}</section>`
        : `<section class="card content-card"><div class="section-header"><div><span class="eyebrow">FIXTURE COMPLETO</span><h2>Jornadas</h2><p>Una rueda: todos contra todos.</p></div></div><div class="tournament-round-list">${rounds}</div></section>`}`
    : `<section class="card content-card"><div class="section-header"><div><span class="eyebrow">CUADRO DEL TORNEO</span><h2>${tournament.format === 'playoff' ? 'Llaves · al mejor de 3' : 'Llaves · partido único'}</h2><p>Los ganadores avanzan automáticamente a la siguiente ronda.</p></div></div><div class="tournament-bracket">${rounds}</div></section>`;

  return `${pageHeading('TORNEO · COMPETICIÓN', tournament.name, `${format.label} · ${format.detail}`, '<a class="button button-secondary" href="#tournaments">← Todos los torneos</a>')}
    <section class="tournament-detail-hero"><div class="tournament-detail-main"><span class="tournament-format-badge">${escapeHtml(format.label)}</span><span class="tournament-status ${tournament.status === 'completed' ? 'is-complete' : live ? 'is-live' : ''}"><i></i>${statusText(tournament, live, tournamentMatches)}</span><div class="tournament-detail-team-row">${teams.slice(0, 8).map(team => teamMark(team, 'small-mark')).join('')}</div><p>${formatDate(tournament.date)} <b>·</b> ${teams.length} equipos <b>·</b> ${complete} de ${tournamentMatches.length} partidos finalizados</p></div>${championPanel || `<div class="tournament-progress"><strong>${tournamentMatches.length ? Math.round((complete / tournamentMatches.length) * 100) : 0}<small>%</small></strong><span>partidos jugados</span><div><i style="width:${tournamentMatches.length ? Math.round((complete / tournamentMatches.length) * 100) : 0}%"></i></div></div>`}</section>
    ${competition}
    <section class="card content-card tournament-participants"><div class="section-header"><div><span class="eyebrow">PARTICIPANTES</span><h2>Equipos y plantillas</h2><p>Los partidos usarán los jugadores registrados en cada equipo al iniciarse.</p></div></div><div class="tournament-participant-grid">${teams.map(team => `<div class="tournament-participant">${teamMark(team)}<div><b>${escapeHtml(team.name)}</b><small>${escapeHtml(team.city)} · ${store.players.filter(player => player.teamId === team.id).length} jugadores</small></div></div>`).join('')}</div></section>`;
}

function renderStandings(store, standings) {
  return `<div class="table-scroll"><table class="data-table tournament-standings"><thead><tr><th>POS</th><th>Equipo</th><th>PJ</th><th>G</th><th>P</th><th>PTS</th><th>PF</th><th>PC</th><th>DIF</th></tr></thead><tbody>${standings.map((row, index) => {
    const team = store.teams.find(item => item.id === row.teamId);
    if (!team) return '';
    const difference = row.pointDifference > 0 ? `+${row.pointDifference}` : String(row.pointDifference);
    return `<tr class="${index < 2 ? 'qualifies' : ''}"><td><span class="rank-number">${String(index + 1).padStart(2, '0')}</span></td><td><span class="standings-team">${teamMark(team, 'mini')}<b>${escapeHtml(team.name)}</b></span></td><td>${row.games}</td><td>${row.wins}</td><td>${row.losses}</td><td><b>${row.classificationPoints}</b></td><td>${row.pointsFor}</td><td>${row.pointsAgainst}</td><td class="${row.pointDifference > 0 ? 'diff-positive' : row.pointDifference < 0 ? 'diff-negative' : ''}">${difference}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function renderRound(store, tournament, round, roundIndex) {
  if (round.stage === 'final') return `<!--FINAL-ROUND-->${renderRoundContents(store, tournament, round, roundIndex)}`;
  const fixtures = round.fixtures.map((fixture, fixtureIndex) => renderFixture(store, tournament, round, fixture, roundIndex, fixtureIndex)).join('');
  return `<section class="tournament-round-column"><header><span>${String(roundIndex + 1).padStart(2, '0')}</span><div><b>${escapeHtml(round.name)}</b><small>${round.fixtures.length} llave${round.fixtures.length === 1 ? '' : 's'}</small></div></header><div class="tournament-round-games">${fixtures || emptyState('Sin partidos', 'Esta jornada no tiene cruces.')}</div></section>`;
}

function renderRoundContents(store, tournament, round, roundIndex) {
  const fixture = round.fixtures[0];
  return renderFixture(store, tournament, round, fixture, roundIndex, 0);
}

function renderWaitingFinal() {
  return `<div class="tournament-final-waiting"><span>🏆</span><div><b>Final por definir</b><small>Se programará al terminar la fase de grupo.</small></div></div>`;
}

function renderFixture(store, tournament, round, fixture, roundIndex, fixtureIndex) {
  const home = store.teams.find(team => team.id === fixture.homeTeamId);
  const away = store.teams.find(team => team.id === fixture.awayTeamId);
  const matches = fixture.matchIds.map(id => store.matches.find(match => match.id === id)).filter(Boolean);
  const homeName = home?.name || (fixture.status === 'bye' ? 'Avanza por bye' : 'Por definir');
  const awayName = away?.name || (fixture.status === 'bye' ? '—' : 'Por definir');
  const result = fixture.winnerTeamId ? `<span class="fixture-winner">Ganador: ${escapeHtml(store.teams.find(team => team.id === fixture.winnerTeamId)?.name || '')}</span>` : '';
  const seriesScore = tournament.format === 'playoff' && fixture.winnerTeamId === null
    ? `<span class="series-score">${fixture.wins?.[fixture.homeTeamId] || 0} <i>–</i> ${fixture.wins?.[fixture.awayTeamId] || 0}</span>` : '';
  const matchList = matches.length ? `<div class="fixture-matches">${matches.map(match => renderTournamentMatch(store, match)).join('')}</div>` : '';
  const fixtureLabel = round.name === 'Final' ? 'FINAL' : round.stage === 'knockout' ? `LLAVE ${String(fixtureIndex + 1).padStart(2, '0')}` : escapeHtml(formatDate(tournament.date));
  return `<article class="tournament-fixture ${fixture.status === 'bye' ? 'fixture-bye' : ''}"><div class="fixture-head"><span>${fixtureLabel}</span>${fixture.status === 'bye' ? '<b>BYE</b>' : seriesScore}</div><div class="fixture-team ${fixture.winnerTeamId === fixture.homeTeamId ? 'is-winner' : ''}">${teamMark(home, 'mini')}<b>${escapeHtml(homeName)}</b>${fixture.winnerTeamId === fixture.homeTeamId ? '<span>✓</span>' : ''}</div><div class="fixture-team ${fixture.winnerTeamId === fixture.awayTeamId ? 'is-winner' : ''}">${teamMark(away, 'mini')}<b>${escapeHtml(awayName)}</b>${fixture.winnerTeamId === fixture.awayTeamId ? '<span>✓</span>' : ''}</div>${result}${matchList}</article>`;
}

function renderTournamentMatch(store, match) {
  const home = store.teams.find(team => team.id === match.homeTeamId);
  const away = store.teams.find(team => team.id === match.awayTeamId);
  if (!home || !away) return '';
  const action = match.status === 'scheduled'
    ? `<button class="button button-small button-primary" data-action="start-match" data-id="${match.id}">Iniciar juego</button>`
