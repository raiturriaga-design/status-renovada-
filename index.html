<script>/* STATS HUB CHILE 3.0 — local competition domain. No accounts or network. */
(function(root){

const uid=()=>globalThis.crypto?.randomUUID?.()||'sh-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
const copy=x=>JSON.parse(JSON.stringify(x));
const norm=x=>String(x??'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').toLowerCase();
const num=x=>Number.isFinite(Number(x))?Number(x):0;
const fields=['pts','reb','ast','stl','blk','tov','pf','ftm','fta','fg2m','fg2a','fg3m','fg3a'];
const zero=()=>Object.fromEntries(fields.map(k=>[k,0]));
const fail=s=>{throw Error(s)};
const actions={
 ft:{label:'Libre convertido',short:'+1',delta:{pts:1,ftm:1,fta:1},points:1},
 two:{label:'Doble convertido',short:'+2',delta:{pts:2,fg2m:1,fg2a:1},points:2},
 three:{label:'Triple convertido',short:'+3',delta:{pts:3,fg3m:1,fg3a:1},points:3},
 miss1:{label:'Libre fallado',short:'TL ×',delta:{fta:1}},
 miss2:{label:'Doble fallado',short:'2P ×',delta:{fg2a:1}},
 miss3:{label:'Triple fallado',short:'3P ×',delta:{fg3a:1}},
 reb:{label:'Rebote',short:'REB',delta:{reb:1}},ast:{label:'Asistencia',short:'AST',delta:{ast:1}},
 stl:{label:'Robo',short:'ROB',delta:{stl:1}},blk:{label:'Tapón',short:'TAP',delta:{blk:1}},
 tov:{label:'Pérdida',short:'PER',delta:{tov:1}},pf:{label:'Falta personal',short:'FAL',delta:{pf:1}}
};
function blank(){return {schema:3,revision:0,updatedAt:null,settings:{season:String(new Date().getFullYear()),minutes:10,periods:4,place:'',winPoints:2,lossPoints:1,forfeitPoints:0},clubs:[],teams:[],players:[],tournaments:[],games:[]}}
function stats(g,pid){const s={...zero(),...(g.base?.stats?.[pid]||{})};for(const e of g.events||[]){if(e.void||e.playerId!==pid||!actions[e.type])continue;for(const [k,v]of Object.entries(actions[e.type].delta))s[k]=num(s[k])+v}return s}
function score(g){const r={home:num(g.base?.home),away:num(g.base?.away)};for(const e of g.events||[])if(!e.void&&actions[e.type]&&['home','away'].includes(e.side))r[e.side]+=actions[e.type].points||0;return r}
function periodScores(g){const r=Array.from({length:Math.max(g.periods||4,g.period||1,...(g.events||[]).map(e=>e.period||1))},()=>({home:0,away:0}));for(const e of g.events||[])if(!e.void&&actions[e.type]&&r[e.period-1])r[e.period-1][e.side]+=actions[e.type].points||0;return r}
function sideOf(g,pid){return (g.roster.home||[]).includes(pid)?'home':(g.roster.away||[]).includes(pid)?'away':null}
function team(d,id){return d.teams.find(t=>t.id===id)}
function player(d,id){return d.players.find(p=>p.id===id)}
function tournament(d,id){return d.tournaments.find(t=>t.id===id)}
function roster(d,tid){return d.players.filter(p=>p.teamId===tid&&!p.archived)}
function gameName(d,g,side){return g.names?.[side]||team(d,g[side+'Id'])?.name||'Por definir'}
function snapPlayer(d,g,pid){return g.snapshots?.[pid]||player(d,pid)||{id:pid,name:'Jugador archivado',jersey:''}}
function efficiency(s){return s.pts+s.reb+s.ast+s.stl+s.blk-(s.fg2a-s.fg2m)-(s.fg3a-s.fg3m)-(s.fta-s.ftm)-s.tov}
function percent(m,a){return a?Math.round(m/a*100):null}
function aggregate(d,pid,filters={}){const a={...zero(),gp:0};for(const g of d.games){if(g.status!=='finished'||(!g.validated&&!filters.includePending)||g.outcome?.kind==='forfeit')continue;const side=sideOf(g,pid);if(!side||filters.teamId&&g[side+'Id']!==filters.teamId||filters.season&&g.season!==filters.season||filters.tournamentId&&g.tournamentId!==filters.tournamentId)continue;a.gp++;const s=stats(g,pid);for(const k of fields)a[k]+=num(s[k])}return {...a,eff:efficiency(a)}}
function leaders(d,filters={}){return d.players.map(p=>({...p,...aggregate(d,p.id,filters)})).filter(p=>p.gp>0)}
function gameTotal(g,side){const a=zero();for(const pid of g.roster[side]){const s=stats(g,pid);for(const k of fields)a[k]+=num(s[k])}return a}
function syncClock(g,now=Date.now()){const stoppedAt=Math.min(now,g.deadline||Infinity,g.shotDeadline||Infinity);if(g.deadline)g.remaining=Math.max(0,(g.deadline-stoppedAt)/1000);if(g.shotDeadline)g.shotRemaining=Math.max(0,(g.shotDeadline-stoppedAt)/1000);return g}
function validatePlayer(d,p,id){if(!p.name?.trim())fail('Escribe el nombre del jugador.');if(p.jersey!==''&&(!Number.isInteger(Number(p.jersey))||num(p.jersey)<0||num(p.jersey)>99))fail('El dorsal debe ser un número entero entre 0 y 99.');if(p.teamId&&!team(d,p.teamId))fail('Selecciona un equipo válido.');if(d.players.some(x=>x.id!==id&&!x.archived&&norm(x.name)===norm(p.name)&&x.teamId===p.teamId))fail('Ya existe un jugador con ese nombre en esta plantilla. Edita su ficha.');if(p.teamId&&p.jersey!==''&&d.players.some(x=>x.id!==id&&!x.archived&&x.teamId===p.teamId&&x.jersey!==''&&Number(x.jersey)===Number(p.jersey)))fail('Ese dorsal ya está ocupado en el equipo.');if(p.height&&(num(p.height)<50||num(p.height)>260))fail('Revisa la estatura (50 a 260 cm).');if(p.weight&&(num(p.weight)<10||num(p.weight)>300))fail('Revisa el peso (10 a 300 kg).')}
function savePlayer(d,p,id){validatePlayer(d,p,id);const old=player(d,id);const data={...(old||{}),...p,id:old?.id||uid(),name:p.name.trim(),jersey:p.jersey===''?'':String(Number(p.jersey)),archived:false};if(old)Object.assign(old,data);else d.players.push(data);return data}
function saveTeam(d,t,id){if(!t.name?.trim())fail('Escribe el nombre del equipo.');if(d.teams.some(x=>x.id!==id&&norm(x.name)===norm(t.name)))fail('Ya existe un equipo con ese nombre.');const old=team(d,id);const data={...(old||{}),...t,id:old?.id||uid(),name:t.name.trim(),color:/^#[0-9a-f]{6}$/i.test(t.color)?t.color:'#21c9cb',archived:false};if(old)Object.assign(old,data);else d.teams.push(data);return data}
function makeGame(d,o){if(o.homeId&&o.homeId===o.awayId)fail('Elige dos equipos diferentes.');const length=num(o.periodLength)||num(d.settings.minutes)*60;return {id:uid(),homeId:o.homeId||null,awayId:o.awayId||null,tournamentId:null,season:d.settings.season,phase:'friendly',round:1,slot:0,date:'',time:'',place:d.settings.place||'',periods:num(d.settings.periods)||4,periodLength:length,period:1,remaining:length,deadline:null,shotRemaining:24,shotDeadline:null,shotEnabled:false,status:'scheduled',validated:false,roster:{home:[],away:[]},names:{},snapshots:{},base:{home:0,away:0,stats:{}},events:[],timeouts:{home:0,away:0},createdAt:new Date().toISOString(),...o}}
function setRoster(d,g,home,away){if(g.validated||g.status==='finished')fail('Reabre el partido antes de editar la convocatoria.');if(home.some(x=>away.includes(x)))fail('Un jugador no puede estar en los dos equipos.');for(const [side,ids]of [['home',home],['away',away]]){if(ids.length>30)fail('La convocatoria admite hasta 30 jugadores por equipo.');if(new Set(ids).size!==ids.length)fail('Hay jugadores repetidos.');for(const pid of ids){if(!player(d,pid))fail('La convocatoria contiene un jugador inexistente.');if(!g.roster[side].includes(pid)&&player(d,pid).teamId!==g[side+'Id'])fail('El jugador no pertenece a este equipo.')}for(const pid of g.roster[side])if(!ids.includes(pid)&&(g.events.some(e=>!e.void&&e.playerId===pid)||Object.values(g.base?.stats?.[pid]||{}).some(v=>num(v)>0)))fail('No puedes quitar a un jugador que ya tiene estadísticas.');g.roster[side]=[...ids];for(const pid of ids){const p=player(d,pid);if(!g.snapshots[pid]||g.status==='scheduled')g.snapshots[pid]={id:p.id,name:p.name,jersey:p.jersey,position:p.position,photo:p.photo||'',teamId:g[side+'Id']}}}g.names={home:team(d,g.homeId)?.name||g.names.home,away:team(d,g.awayId)?.name||g.names.away}}
function start(d,g){if(g.status==='finished'||g.status==='bye')fail('Este partido ya está cerrado.');if(!g.homeId||!g.awayId)fail('Espera a que se definan los dos clasificados.');if(!g.roster.home.length||!g.roster.away.length)fail('Convoca al menos un jugador por equipo antes de abrir la mesa.');g.status='live';return g}
function addEvent(d,g,pid,type){if(g.status!=='live'||g.validated)fail('Abre un partido activo para registrar acciones.');if(!Object.hasOwn(actions,type))fail('Acción no válida.');const side=sideOf(g,pid);if(!side)fail('Selecciona un jugador de la convocatoria.');if(stats(g,pid).pf>=5&&type!=='pf')fail('El jugador tiene cinco faltas. Corrige la falta si fue un error o selecciona a otro jugador.');if(type==='pf'&&stats(g,pid).pf>=5)fail('Este jugador ya tiene cinco faltas.');const e={id:uid(),playerId:pid,side,type,period:g.period,clock:Math.max(0,Math.ceil(g.remaining)),at:new Date().toISOString(),void:false};g.events.push(e);return e}
function undo(g,eventId){if(g.status!=='live'||g.validated)fail('Reabre el partido para corregir acciones.');const e=eventId?g.events.find(e=>e.id===eventId&&!e.void):[...g.events].reverse().find(e=>!e.void);if(!e)fail('No hay acciones para deshacer.');e.void=true;e.voidAt=new Date().toISOString();return e}
function winner(g){if(g.status==='bye')return g.homeId||g.awayId;if(g.status!=='finished'||!g.validated)return null;const s=score(g);return s.home>s.away?g.homeId:s.away>s.home?g.awayId:null}

function propagate(d,g){const w=winner(g);if(!w||!g.next)return;const target=d.games.find(x=>x.id===g.next.gameId);if(!target)return;const side=g.next.side;if(target[side+'Id']===w)return;if(started(target))fail('La siguiente llave ya comenzó. No se puede cambiar su clasificado.');target[side+'Id']=w;target.roster[side]=[];target.names[side]=team(d,w)?.name||gameName(d,g,g.homeId===w?'home':'away')}
function finish(d,g,validated=true){if(g.status!=='live')fail('Abre la mesa antes de finalizar.');if(g.events.every(e=>e.void)&&!score(g).home&&!score(g).away&&!g.base?.imported)fail('Registra el resultado antes de finalizar.');const s=score(g);if(g.tournamentId&&s.home===s.away)fail('El torneo necesita un ganador. Agrega una prórroga para desempatar.');g.deadline=null;g.shotDeadline=null;g.status='finished';g.validated=!!validated;g.finishedAt=new Date().toISOString();if(validated)propagate(d,g)}
function validate(d,g){if(g.status!=='finished')fail('Primero finaliza el partido.');if(g.tournamentId&&score(g).home===score(g).away)fail('El partido del torneo está empatado. Reábrelo y juega una prórroga.');g.validated=true;propagate(d,g)}
function reopen(d,g){if(!['finished'].includes(g.status))fail('Este partido no está finalizado.');if(g.outcome?.kind==='forfeit')fail('Elimina el resultado administrativo para volver a programarlo.');let cur=g;while(cur.next){const n=d.games.find(x=>x.id===cur.next.gameId);if(!n)break;if(started(n))fail('Una llave posterior ya comenzó. Conserva el resultado para no alterar el cuadro.');cur=n}if(g.next){const n=d.games.find(x=>x.id===g.next.gameId);if(n){n[g.next.side+'Id']=null;n.names[g.next.side]='';n.roster[g.next.side]=[]}}g.status='live';g.validated=false;g.deadline=null;g.shotDeadline=null}
function forfeit(d,g,loserId){if(g.status!=='scheduled'||g.events.length)fail('La no presentación se registra antes de iniciar el partido.');if(!g.homeId||!g.awayId||![g.homeId,g.awayId].includes(loserId))fail('Selecciona el equipo que no se presentó.');g.outcome={kind:'forfeit',loserId};g.base={home:loserId===g.homeId?0:20,away:loserId===g.awayId?0:20,stats:{}};g.status='finished';g.validated=true;g.roster={home:[],away:[]};g.finishedAt=new Date().toISOString();propagate(d,g)}

S ALLÁ DEL MARCADOR</span><h2>Acciones del equipo por partido</h2><p>Promedios de ${statGames.length} ${statGames.length===1?'partido':'partidos'}; no incluye no presentaciones.</p></div></div><div class="pg-team-activity">${[['reb','Rebotes','#b8a0f5'],['ast','Asistencias','#ffd084'],['stl','Robos','#80baff'],['tov','Pérdidas','#ff8d9e']].map(([k,label,c])=>`<div style="--activity:${c}"><span>${label}</span><b>${statGames.length?C.fmt(totals[k]/statGames.length,1):'—'}</b><small>${C.fmt(totals[k])} registrados</small></div>`).join('')}</div></article></section>`;

let tickSaving=false,audioContext;
function syncClock(g){E.syncClock(g)}
function pauseClock(g){syncClock(g);g.deadline=null;g.shotDeadline=null}
function beep(){try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),a=audioContext.createGain();o.type='sine';o.frequency.value=750;a.gain.value=.16;o.connect(a);a.connect(audioContext.destination);o.start();a.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.55);o.stop(audioContext.currentTime+.55)}catch{}}
function tick(){for(const g of db.games){if(g.status!=='live'||(!g.deadline&&!g.shotDeadline))continue;syncClock(g);if((g.remaining<=0||g.shotDeadline&&g.shotRemaining<=0)&&!tickSaving){const what=g.remaining<=0?'Terminó '+period(g).toLowerCase(): 'Se agotó la posesión';pauseClock(g);beep();tickSaving=true;commit(()=>{},{redraw:current[0]==='desk',message:what+' · reloj en pausa'}).catch(showError).finally(()=>tickSaving=false)}}if(current[0]==='desk'){const g=currentGame(current[1])||db.games.find(g=>g.status==='live');if(!g)return;const gc=$('#gameClock'),sc=$('#shotClock'),button=$('#clockToggle');if(gc){gc.textContent=clock(g.remaining);gc.classList.toggle('expired',g.remaining<=0)}if(sc)sc.textContent=g.shotEnabled===false?'—':Math.ceil(g.shotRemaining??24);if(button&&button.dataset.running!==String(!!g.deadline)){button.innerHTML=I(g.deadline?'pause':'play')+(g.deadline?'Pausar':'Iniciar');button.dataset.running=String(!!g.deadline)}}}

async function compressedPhoto(file){if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Elige una imagen JPG, PNG o WebP.');if(file.size>12*1024*1024)throw Error('La imagen supera 12 MB. Elige una más pequeña.');const url=URL.createObjectURL(file);try{const im=await new Promise((res,rej)=>{const image=new Image();image.onload=()=>res(image);image.onerror=()=>rej(Error('No se pudo leer la imagen.'));image.src=url});const c=document.createElement('canvas'),scale=Math.min(1,360/im.width,360/im.height);c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/webp',.82)}finally{URL.revokeObjectURL(url)}}

function csv(rows,name){const cell=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s.trimStart()))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),name+'.csv','text/csv;charset=utf-8')}
function exportAnalysis(){const f=current[0]==='analysis'?{teamId:ui.team,season:ui.season}:current[0]==='tournament'?{tournamentId:current[1]}:{};const rows=E.leaders(db,f);csv([['Jugador','Equipo actual','PJ','PTS','REB','AST','ROB','TAP','PER','FAL','TL convertidos','TL intentados','2P convertidos','2P intentados','3P convertidos','3P intentados','Valoración','PTS/PJ'],...rows.map(p=>[p.name,E.team(db,p.teamId)?.name||'',p.gp,...['pts','reb','ast','stl','blk','tov','pf','ftm','fta','fg2m','fg2a','fg3m','fg3a','eff'].map(k=>p[k]),avg(p.pts,p.gp)])],'STATS_HUB_CHILE_estadisticas_'+stamp());toast('Planilla CSV descargada')}
function exportGame(id){const g=currentGame(id);if(!g)return;const sc=E.score(g),rows=[['STATS HUB CHILE','Informe de partido'],['Local',E.gameName(db,g,'home'),'Marcador',sc.home],['Visita',E.gameName(db,g,'away'),'Marcador',sc.away],['Fecha',g.date,'Cancha',g.place],['Estado',g.status,'Validado',g.validated?'Sí':'No'],[],['Equipo','Dorsal','Jugador','PTS','TL C','TL I','2P C','2P I','3P C','3P I','REB','AST','ROB','TAP','PER','FAL','VAL']];for(const side of ['home','away'])for(const pid of g.roster[side]){const p=E.snapPlayer(db,g,pid),s=E.stats(g,pid);rows.push([E.gameName(db,g,side),p.jersey,p.name,...['pts','ftm','fta','fg2m','fg2a','fg3m','fg3a','reb','ast','stl','blk','tov','pf'].map(k=>s[k]),E.efficiency(s)])}csv(rows,'STATS_HUB_CHILE_partido_'+stamp())}
function addDemo(d){if(d.players.length||d.teams.length||d.games.length||d.tournaments.length||d.clubs.length)throw Error('La demostración solo se carga en un espacio vacío. Tus datos actuales se conservan.');const club={id:E.uid(),name:'Básquetbol del Maule · Demo',city:'Curicó',contact:'Datos ficticios para explorar'};d.clubs.push(club);const configs=[['Cóndores de Curicó','CON','#37d6cf','Curicó'],['Halcones del Maule','HAL','#ff9b59','Talca'],['Tigres de Molina','TIG','#b99aff','Molina'],['Pumas de Teno','PUM','#80b6ff','Teno']],names=[['Tomás Rojas','Benjamín Soto','Mateo Silva','Nicolás Pérez','Lucas Muñoz','Cristóbal Vera'],['Diego González','Vicente Díaz','Martín Castro','Agustín Reyes','Joaquín Vera','Felipe Navarro'],['Maximiliano Torres','Álvaro Espinoza','Daniel Morales','Simón Castillo','Esteban Ramírez','Bruno Araya'],['Cristian López','Andrés Riquelme','Felipe Salas','Nicolás Aravena','Mauricio Reyes','Javier Molina']];configs.forEach(([name,short,color,city],i)=>{const t=E.saveTeam(d,{name,short,color,city,category:'U18',clubId:club.id,coach:'Entrenador demo'});names[i].forEach((name,j)=>E.savePlayer(d,{name,jersey:String([4,7,9,11,15,6][j]),position:positions[j%5],teamId:t.id,category:'U18',city,height:170+j*4,weight:65+j*3,photo:''}))});const t={id:E.uid(),name:'Copa del Maule · Demo',format:'mixed',category:'U18',city:'Curicó',place:'Gimnasio Abraham Milad',teamIds:d.teams.map(t=>t.id),season:d.settings.season,minutes:10,periods:4,legs:1,playoffTeams:4,winPoints:2,lossPoints:1,forfeitPoints:0};d.tournaments.push(t);const games=E.roundRobin(d,t);games.forEach((g,i)=>{const dt=new Date();dt.setDate(dt.getDate()+i-2);g.date=dt.toISOString().slice(0,10);g.time='18:30'});for(let n=0;n<2;n++){const g=games[n];E.setRoster(d,g,E.roster(d,g.homeId).map(p=>p.id),E.roster(d,g.awayId).map(p=>p.id));E.start(d,g);for(let q=1;q<=4;q++){g.period=q;for(let side of ['home','away'])for(let k=0;k<(side==='home'?7:6);k++){const pid=g.roster[side][(k+q)%6];g.remaining=580-k*65;E.addEvent(d,g,pid,k%3===0?'three':k%3===1?'two':'ft');if(k%2===0)E.addEvent(d,g,pid,'reb');if(k%3===0)E.addEvent(d,g,g.roster[side][(k+q+1)%6],'ast');if(k===4)E.addEvent(d,g,pid,'miss2')}}g.remaining=0;E.finish(d,g,true)}d.demo=true}

async function handle(name,id,el){
 const gid=currentGame()?.id;
 if(publicMode&&!['close','more','help','all-players','analysis-csv','game-csv','print'].includes(name))throw Error('Esta copia es de consulta.');
 switch(name){
 case 'close':close();return;
 case 'dismiss-tutorial':await commit(d=>{d.settings.tutorialDismissed=true;d.settings.tutorialForce=false});return;
 case 'show-tutorial':await commit(d=>{d.settings.tutorialDismissed=false;d.settings.onboardingCompleted=false;d.settings.tutorialForce=true});close();nav('home');return;
 case 'go-live':{const g=db.games.find(g=>g.status==='live');if(g)nav('desk/'+g.id);else gameForm();return}
 case 'public-export':exportPublicPage();return;
 case 'recovery-new':confirmModal('Conservar originales y continuar','Se protegerá el contenido anterior en el respaldo interno y en una descarga. Podrás crear equipos en un espacio nuevo. Esta acción no recupera registros ilegibles.','confirm-recovery-new','','Conservar y continuar');return;
 case 'confirm-recovery-new':{const data=E.blank();data.recoverySources=Store.recoveries.map((r,i)=>({id:'original-'+i,reason:r.error,original:r.raw,source:r.source}));download(JSON.stringify({originals:data.recoverySources},null,2),'STATS_HUB_CHILE_originales_'+stamp()+'.json');await restoreWorkspace(data);close();nav('home');return}
 case 'quick-score':{const pid=el.dataset.player;ui.selected=pid;ui.deskSide=E.sideOf(currentGame(),pid);await gameCommit(gid,(d,g)=>E.addEvent(d,g,pid,id));return}
 case 'reset-clock':confirmModal('Reiniciar el reloj','El tiempo volverá a la duración del cuarto actual y quedará en pausa. El marcador y las acciones se conservan.','confirm-reset-clock',id,'Reiniciar reloj');return;
 case 'confirm-reset-clock':await gameCommit(id,(d,g)=>{pauseClock(g);g.remaining=g.period>g.periods?300:g.periodLength;g.shotRemaining=24});close();return;
 case 'reload':location.reload();return;
 case 'retry-storage':if(await boot(true))toast('Guardado disponible. Puedes continuar.');return;
 case 'export-recovery':download(JSON.stringify({app:'STATS HUB CHILE',version:'4.1',savedAt:new Date().toISOString(),originals:[...Store.recoveries,...(Array.isArray(db.recoverySources)?db.recoverySources:[])]},null,2),'STATS_HUB_CHILE_original_para_recuperacion_'+stamp()+'.json');return;
 case 'more':showMore();return;
 case 'help':showHelp();return;
 case 'all-players':close();nav('players');return;
 case 'desk-options':deskOptions(id);return;
 case 'desk-side':ui.deskSide=id;ui.selected=null;render();return;
 case 'start-game':await gameCommit(id,(d,g)=>{E.setRoster(d,g,g.roster.home.length?g.roster.home:E.roster(d,g.homeId).map(p=>p.id),g.roster.away.length?g.roster.away:E.roster(d,g.awayId).map(p=>p.id));E.start(d,g)},{message:'Partido listo. Selecciona un jugador.'});close();ui.deskSide='home';nav('desk/'+id);return;
 case 'quick':modal('¿Qué vamos a crear?',`<div class="quick-grid">${[['player-form','users','Jugador'],['team-form','team','Equipo'],['game-form','desk','Partido'],['tournament-form','trophy','Torneo']].map(([a,i,t])=>`<button class="quick-item" data-action="${a}">${I(i)}${t}</button>`).join('')}</div>`);return;
 case 'player-form':playerForm(id);return;
 case 'player-form-team':playerForm('',id);return;
 case 'team-form':teamForm(id);return;
 case 'team-form-club':teamForm('',id);return;
 case 'club-form':clubForm(id);return;
 case 'tournament-form':tournamentForm(id);return;
 case 'game-form':gameForm();return;
 case 'game-form-team':gameForm(id);return;
 case 'bulk':bulkForm(id);return;
 case 'schedule':scheduleForm(id);return;
 case 'prepare':rosterForm(id,true);return;
 case 'roster':rosterForm(id);return;
 case 'open-desk':close();nav('desk/'+id);return;
 case 'pick-all':{const xs=[...document.querySelectorAll(`#modal input[name="${id}"]`)];const all=xs.every(x=>x.checked);xs.forEach(x=>{if(!x.dataset.locked)x.checked=!all});return}
 case 'select-player':ui.selected=id;ui.deskSide=E.sideOf(currentGame(),id)||'home';render();return;
 case 'stat':{const pid=ui.selected;if(!pid)throw Error('Primero selecciona un jugador.');await gameCommit(gid,(d,g)=>E.addEvent(d,g,pid,id));return}
 case 'undo':await gameCommit(id,(d,g)=>E.undo(g),{message:'Última acción anulada'});return;
 case 'undo-event':confirmModal('Anular esta acción','La acción quedará marcada como anulada y se corregirán las estadísticas y el marcador.','confirm-undo',id,'Anular acción');return;
 case 'confirm-undo':await gameCommit(gid,(d,g)=>E.undo(g,id),{message:'Acción anulada'});close();return;
 case 'clock':{try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();audioContext.resume()}catch{}await gameCommit(gid,(d,g)=>{if(g.deadline)pauseClock(g);else{if(g.remaining<=0)throw Error('El cuarto terminó. Avanza al siguiente o ajusta el reloj.');g.deadline=Date.now()+g.remaining*1000;if(g.shotEnabled!==false){if(g.shotRemaining<=0)g.shotRemaining=24;g.shotDeadline=Date.now()+g.shotRemaining*1000}}},{redraw:false});tick();return}
 case 'clock-form':clockForm(id);return;
 case 'shot-reset':await gameCommit(gid,(d,g)=>{g.shotRemaining=Number(id);g.shotEnabled=true;g.shotDeadline=g.deadline?Date.now()+Number(id)*1000:null},{redraw:false});tick();return;
 case 'shot-toggle':await gameCommit(gid,(d,g)=>{g.shotEnabled=g.shotEnabled===false;g.shotDeadline=g.shotEnabled&&g.deadline?Date.now()+(g.shotRemaining||24)*1000:null});close();return;
 case 'next-period':{const g=currentGame(id);if(g.period>=g.periods&&E.score(g).home!==E.score(g).away)return finishForm(id);if(g.period>=30)throw Error('Se alcanzó el máximo de prórrogas.');confirmModal(g.period>=g.periods?'Agregar una prórroga':'Avanzar de cuarto',g.period>=g.periods?'El marcador está empatado. Se agregará una prórroga de 5 minutos.':'Se cerrará el cuarto actual y el reloj volverá a '+clock(g.periodLength)+'. Las acciones registradas se conservan.','advance-period',id,g.period>=g.periods?'Agregar prórroga':'Siguiente cuarto');return}
 case 'advance-period':await gameCommit(id,(d,g)=>{pauseClock(g);g.period++;g.remaining=g.period>g.periods?300:g.periodLength;g.shotRemaining=24},{message:'Reloj listo · '+period(currentGame(id))});close();return;
 case 'timeout':await gameCommit(gid,(d,g)=>{pauseClock(g);g.timeouts[id]=Math.min(10,(g.timeouts[id]||0)+1)},{message:'Tiempo muerto · reloj en pausa'});close();return;
 case 'timeout-edit':{const g=currentGame();form('Corregir tiempos muertos','timeout',input('count','Tiempos muertos usados',g.timeouts[id]||0,'number','required min="0" max="10" step="1"'),{id:gid,side:id});return}
 case 'shortcuts':modal('Atajos para la mesa',`<div class="table-wrap"><table><thead><tr><th>Tecla</th><th>Acción</th></tr></thead><tbody>${[['1 / 2 / 3','Libre / doble / triple'],['R','Rebote'],['A','Asistencia'],['S','Robo'],['B','Tapón'],['T','Pérdida'],['F','Falta'],['Espacio','Iniciar o pausar reloj'],['Ctrl/Cmd + Z','Deshacer última acción']].map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</tbody></table></div><p class="legend">Primero selecciona un jugador. Los atajos no se activan mientras escribes en un formulario.</p>`);return;
 case 'finish-form':finishForm(id);return;
 case 'validate':await gameCommit(id,(d,g)=>E.validate(d,g),{message:'Resultado validado · estadísticas actualizadas'});return;
 case 'reopen':confirmModal('Reabrir el partido','El resultado saldrá de las estadísticas y la clasificación hasta que vuelvas a validarlo. Podrás corregir acciones y jugar una prórroga.','confirm-reopen',id,'Reabrir para corregir');return;
 case 'confirm-reopen':await gameCommit(id,(d,g)=>E.reopen(d,g),{message:'Partido reabierto'});close();nav('desk/'+id);return;
 case 'reset-forfeit':confirmModal('Corregir no presentación','El resultado administrativo se retirará de la clasificación y el partido volverá a estar programado.','confirm-reset-forfeit',id,'Volver a programar');return;
 case 'confirm-reset-forfeit':await gameCommit(id,(d,g)=>E.resetForfeit(d,g),{message:'Resultado administrativo anulado'});close();return;
 case 'forfeit-form':{const g=currentGame(id);form('Registrar no presentación','forfeit',select('loserId','Equipo que no se presentó',[[g.homeId,E.gameName(db,g,'home')],[g.awayId,E.gameName(db,g,'away')]],g.homeId)+`<p class="form-note">Se registrará 20–0 para el equipo presente. El ausente recibirá 0 puntos de clasificación. No se sumarán partidos ni puntos a los jugadores.</p>`,{id},'Registrar resultado');return}
 case 'delete-game':confirmModal('Eliminar amistoso','Se eliminará este partido y sus estadísticas.','confirm-delete-game',id,'Eliminar',true);return;
 case 'confirm-delete-game':await commit(d=>E.deleteGame(d,id),{message:'Partido eliminado'});close();nav('games');return;
 case 'archive-player':{const p=E.player(db,id);if(p.archived){await commit(d=>{const p=E.player(d,id);E.validatePlayer(d,p,id);p.archived=false},{message:'Jugador reactivado'});return}confirmModal('Archivar jugador','Quedará fuera de las próximas convocatorias. Su historial y los partidos anteriores se conservan.','confirm-archive-player',id,'Archivar');return}
 case 'confirm-archive-player':await commit(d=>{E.player(d,id).archived=true},{message:'Jugador archivado'});close();return;
 case 'archive-team':{const t=E.team(db,id);if(!t)return;if(t.archived){await commit(d=>E.team(d,id).archived=false,{message:'Equipo reactivado'});return}confirmModal('Eliminar equipo','Se quitará de la lista activa. Si tiene partidos o torneos, se conservará archivado para proteger su historial. Los jugadores seguirán registrados.','confirm-delete-team',id,'Eliminar equipo',true);return}
 case 'confirm-delete-team':await commit(d=>E.removeTeam(d,id),{message:'Equipo retirado de la lista activa'});close();nav('teams');return;
 case 'remove-player-team':{const p=E.player(db,id);if(!p)return;confirmModal('Quitar del plantel','Se quitará a '+esc(p.name)+' del equipo actual. Su ficha y los partidos anteriores se conservarán.','confirm-remove-player-team',id,'Quitar jugador');modalContext.teamId=current[1];return}

 case 'generate':{const t=E.tournament(db,id);const n=t.teamIds.length,count=t.format==='knockout'?2**Math.ceil(Math.log2(n))-1:n*(n-1)/2*t.legs;confirmModal('Generar '+(t.format==='knockout'?'llaves':'calendario'),`${n} equipos inscritos · ${count} ${t.format==='knockout'?'cruces, incluyendo posibles pases libres':'partidos'}. Después podrás ajustar la sede y el horario de cada encuentro.`,'confirm-generate',id,'Generar ahora');return}

 case 'playoffs':{const t=E.tournament(db,id),regular=db.games.filter(g=>g.tournamentId===id&&g.phase==='league');if(!regular.length||regular.some(g=>g.status!=='finished'||!g.validated))throw Error('Finaliza y valida toda la fase regular antes de generar los playoffs.');const leaders=E.standings(db,t).slice(0,Math.min(t.playoffTeams,t.teamIds.length));confirmModal('Generar playoffs',`Clasificados por tabla: ${leaders.map((r,i)=>(i+1)+'. '+esc(r.name)).join(' · ')}. Se cruzarán las siembras altas con las bajas.`,'confirm-playoffs',id,'Generar llaves');return}
 case 'confirm-playoffs':await commit(d=>E.playoffs(d,E.tournament(d,id)),{message:'Playoffs generados'});close();ui.tTab='bracket';render();return;
 case 'export':exportDB();toast('Respaldo descargado');return;

 else if(kind==='game'){let gid;const play=intent!=='schedule',review=f.has('reviewRoster');await commit(d=>{if(!v.homeId||!v.awayId)throw Error('Selecciona ambos equipos.');const g=E.makeGame(d,{homeId:v.homeId,awayId:v.awayId,date:v.date,time:v.time,place:v.place.trim(),season:v.season.trim(),periodLength:Number(v.minutes)*60,periods:Number(v.periods),shotEnabled:false});if(play&&!review){E.setRoster(d,g,E.roster(d,g.homeId).map(p=>p.id),E.roster(d,g.awayId).map(p=>p.id));E.start(d,g)}d.games.push(g);gid=g.id},{message:play&&!review?'Partido listo. Selecciona un jugador.':'Partido programado'});close();ui.deskSide='home';await nav((play&&!review?'desk/':'report/')+gid);if(play&&review)rosterForm(gid,true)}

 if(publicMode||event.key!==Store.signalKey||!event.newValue)return;
 try{
  const signal=JSON.parse(event.newValue);if(signal.writer===Store.writer||signal.database&&signal.database!==Store.dbName||signal.backend&&signal.backend!==Store.backend)return;

  if(writes||$('#modal').open||current[0]==='desk'){externalPending=true;return}
  const latest=await Store.latest();if(SHStorage.revision(latest.revision)<=SHStorage.revision(db.revision))return;

async function boot(retry=false){
 if(publicMode){db=E.validateBackup(window.SH_PUBLIC_DATA);storageStatus='public';state();render();return true}
 storageStatus='loading';state('Abriendo datos…');
 const work=(async()=>{
  try{
   const snapshot=await(retry?Store.retry():Store.initialize());db=E.copy(snapshot);let recoveredClock=false;
   for(const g of db.games)if(g.deadline||g.shotDeadline){E.syncClock(g);g.deadline=null;g.shotDeadline=null;recoveredClock=true}
   if(recoveredClock){try{db=await Store.write(db,snapshot)}catch(error){if(error.code==='CONFLICT')db=Store.adopt(await Store.latest());else throw error}}
   storageStatus='ready';storageFailure=null;state('Guardado');render();
   if(recoveredClock)toast('Partido recuperado · reloj en pausa');return true;
  }catch(error){if(Store.preview)db=Store.preview;storageNotice(error);render();return false}
 })();storageReady=work;return work;
}
boot();
setInterval(()=>{if(storageStatus==='ready')tick()},200);
})();
