<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>ESTADÍSTICAS CHILE</title>
  <style>
:root {
  color-scheme: light;
  --ink: #13223b;
  --ink-2: #34445e;
  --muted: #6e7c93;
  --muted-light: #96a1b3;
  --line: #e4eaf2;
  --paper: #fff;
  --canvas: #f4f6fb;
  --green: #315ce8;
  --green-dark: #2448c6;
  --green-soft: #e9efff;
  --blue: #1689e8;
  --red: #ed536c;
  --shadow: 0 12px 32px rgba(22, 37, 67, .065);
  font-family: 'Segoe UI', Arial, sans-serif;
  color: var(--ink);
  background: var(--canvas);
}

* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; min-height: 100vh; background: var(--canvas); }
button, input, select { font: inherit; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .48; }
input, select { min-width: 0; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #53b88b66; outline-offset: 2px; }

.app-shell { display: flex; min-height: 100vh; }
.sidebar { position: fixed; z-index: 10; top: 0; bottom: 0; left: 0; display: flex; flex-direction: column; width: 242px; padding: 22px 15px 16px; color: #eaf2ed; background: linear-gradient(165deg,#101b38,#10182d 72%,#18264a); box-shadow: 12px 0 32px #101b3812; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 9px 25px; }
.brand-mark { display: grid; flex: 0 0 37px; width: 37px; height: 37px; place-items: center; border-radius: 12px; color: #101a35; background: linear-gradient(145deg,#ffbd4a,#ff8d3a); font-family: Manrope, sans-serif; font-size: 12px; font-weight: 900; letter-spacing: -.08em; box-shadow: 0 5px 16px #ff9b3840; }
.brand b { display: block; font-family: Manrope, sans-serif; font-size: 11px; letter-spacing: .055em; }
.brand small { display: block; margin-top: 3px; color: #9aabc8; font-size: 8px; font-weight: 700; letter-spacing: .11em; }
.nav-caption { padding: 0 11px 9px; color: #7485a8; font-size: 8px; font-weight: 800; letter-spacing: .15em; }
.main-nav { display: grid; gap: 4px; }
.nav-link { display: flex; align-items: center; gap: 11px; padding: 11px; border: 1px solid transparent; border-radius: 11px; color: #b7c4dd; font-size: 12px; font-weight: 650; transition: .16s ease; }
.nav-link:hover { color: white; background: #ffffff0c; }
.nav-link.active { border-color: #526dd040; color: #fff; background: linear-gradient(100deg,#304a9c80,#1d2e5d55); box-shadow: inset 3px 0 #54b9ff; }
.nav-icon { width: 18px; color: #9bb3de; text-align: center; font-size: 15px; }
.sidebar-bottom { display: flex; align-items: center; gap: 9px; margin-top: auto; padding: 13px 10px 0; border-top: 1px solid #ffffff1a; }
.local-indicator { width: 8px; height: 8px; border-radius: 50%; background: #62d19a; box-shadow: 0 0 0 4px #62d19a1a; }
.sidebar-bottom b, .sidebar-bottom small { display: block; }
.sidebar-bottom b { font-size: 10px; }
.sidebar-bottom small { margin-top: 3px; color: #9ab0a3; font-size: 8px; }
.main-area { width: calc(100% - 242px); min-width: 0; margin-left: 242px; }
.topbar { position: sticky; z-index: 5; top: 0; display: flex; min-height: 66px; align-items: center; justify-content: space-between; padding: 11px clamp(20px, 3vw, 42px); border-bottom: 1px solid #e2e8f0; background: #fbfcffff; backdrop-filter: blur(12px); }
.topbar-kicker { display: block; color: #8794ab; font-size: 8px; font-weight: 800; letter-spacing: .14em; }
.topbar strong { display: block; margin-top: 2px; font-family: Manrope, sans-serif; font-size: 12px; letter-spacing: .06em; }
.local-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border: 1px solid #dce5fa; border-radius: 20px; color: #53668e; background: #f4f7ff; font-size: 8px; font-weight: 800; letter-spacing: .06em; }
.local-chip i { width: 6px; height: 6px; border-radius: 50%; background: #36bd8a; box-shadow: 0 0 0 3px #36bd8a20; }
.mobile-brand { display: none; border: 0; color: var(--ink); background: none; font-size: 19px; }
.page-content { width: min(100%, 1500px); margin: 0 auto; padding: 29px clamp(20px, 3vw, 42px) 48px; }
.page-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 21px; }
.page-heading h1 { margin: 0; color: #14213b; font-family: Manrope, sans-serif; font-size: clamp(23px, 2.4vw, 32px); line-height: 1.15; letter-spacing: -.045em; }
.page-heading p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
.eyebrow { margin-bottom: 6px; color: #54826b; font-size: 8px; font-weight: 850; letter-spacing: .15em; }
.heading-action { display: flex; flex-wrap: wrap; gap: 8px; }
.card { border: 1px solid var(--line); border-radius: 15px; background: var(--paper); box-shadow: var(--shadow); }
.button { display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border: 1px solid transparent; border-radius: 10px; font-size: 10px; font-weight: 800; transition: .15s ease; }
.button-primary { color: white; background: linear-gradient(135deg,#4168f4,#3156df); box-shadow: 0 5px 12px #315ce829; }
.button-primary:hover { background: var(--green-dark); }
.button-secondary { border-color: #dce7df; color: #456455; background: white; }
.button-secondary:hover { border-color: #b7cebe; background: #f6faf7; }
.button-danger { color: white; background: #b53a42; }
.button-danger:hover { background: #992c36; }
.button-warning { color: #774d05; background: #f2d894; }
.button-small { min-height: 28px; padding: 5px 9px; font-size: 9px; }
.text-link { color: var(--green); font-size: 10px; font-weight: 800; }
.text-link span { margin-left: 4px; }
.stat-cards { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-bottom: 17px; }
.summary-card { display: flex; align-items: center; gap: 12px; padding: 15px; }
.summary-icon { display: grid; flex: 0 0 37px; width: 37px; height: 37px; place-items: center; border-radius: 10px; color: var(--green); background: var(--icon-bg); font-size: 16px; font-weight: 800; }
.summary-card span, .summary-card strong, .summary-card small { display: block; }
.summary-card span { color: #75887e; font-size: 9px; font-weight: 700; }
.summary-card strong { margin: 1px 0; color: var(--ink); font-family: Manrope, sans-serif; font-size: 24px; letter-spacing: -.04em; }
.summary-card small { color: #94a29b; font-size: 8px; }
.live-banner { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 16px; padding: 17px 19px; border-color: #bce2cc; background: linear-gradient(110deg,#f4fcf6,#fff); }
.live-banner h2 { margin: 0; font-family: Manrope, sans-serif; font-size: 15px; }
.live-banner p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
.section-card, .content-card { padding: 17px 18px; margin-bottom: 15px; }
.section-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.section-header h2, .content-card > h2 { margin: 0; color: #203c32; font-family: Manrope, sans-serif; font-size: 14px; }
.section-header p { margin: 4px 0 0; color: var(--muted); font-size: 9px; }
.match-list { display: grid; gap: 8px; }
.match-row { display: grid; grid-template-columns: 90px minmax(200px,1fr) 98px auto; align-items: center; gap: 10px; padding: 10px; border: 1px solid #ebf0ec; border-radius: 8px; }
.match-date { color: var(--muted); font-size: 9px; }
.match-teams { display: grid; grid-template-columns: minmax(95px,1fr) 55px minmax(95px,1fr); align-items: center; gap: 7px; }
.match-teams > div { display: flex; min-width: 0; align-items: center; gap: 6px; }
.match-teams > div:last-child { justify-content: end; }
.match-teams b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }
.match-result { text-align: center; font-size: 12px; font-weight: 850; font-variant-numeric: tabular-nums; }
.team-mark { display: grid; flex: 0 0 39px; width: 39px; height: 39px; place-items: center; overflow: hidden; border: 1px solid #deebe2; border-radius: 10px; color: var(--team-color,#176b52); background: #edf6ef; font-family: Manrope, sans-serif; font-size: 11px; font-weight: 900; }
.team-mark img { width: 100%; height: 100%; object-fit: cover; }
.team-mark.mini { flex-basis: 22px; width: 22px; height: 22px; border-radius: 6px; font-size: 7px; }
.team-mark.small-mark { flex-basis: 29px; width: 29px; height: 29px; }
.team-mark.profile-team-mark { margin-left: auto; }
.status-badge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; color: #61766a; font-size: 8px; font-weight: 800; }
.status-badge i { width: 6px; height: 6px; border-radius: 50%; background: #a6b4ac; }
.status-live { color: #a63841; }
.status-live i { background: #e34f5a; box-shadow: 0 0 0 3px #e34f5a18; }
.status-final { color: #536d5d; }
.status-final i { background: #5ba879; }
.compact-list .match-row { grid-template-columns: 80px minmax(180px,1fr) 85px auto; }
.quick-links { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 11px; margin-top: 15px; }
.quick-link { display: grid; grid-template-columns: 34px 1fr; column-gap: 10px; padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: white; transition: .15s; }
.quick-link:hover { border-color: #b7d5c2; transform: translateY(-1px); }
.quick-link > span { grid-row: span 2; display: grid; width: 34px; height: 34px; place-items: center; border-radius: 9px; color: var(--green); background: var(--green-soft); }
.quick-link b { align-self: end; font-size: 10px; }
.quick-link small { margin-top: 3px; color: var(--muted); font-size: 8px; }
.two-column-layout { display: grid; grid-template-columns: minmax(280px,.82fr) minmax(0,1.18fr); align-items: start; gap: 14px; }
.two-column-layout .content-card { min-width: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.field { display: grid; min-width: 0; gap: 5px; color: #4f665a; font-size: 9px; font-weight: 800; }
.field > span { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px; }
.field > span small { color: #97a49c; font-size: 8px; font-weight: 500; }
.field input, .field select { width: 100%; height: 36px; padding: 7px 9px; border: 1px solid #dfe8e2; border-radius: 7px; outline: 0; color: #263f34; background: #fff; font-size: 10px; }
.field input[type="color"] { padding: 4px; }
.field input[type="file"] { height: auto; padding: 7px; }
.field input:focus, .field select:focus { border-color: #7ab495; box-shadow: 0 0 0 3px #65b88a1b; }
.field-full { grid-column: 1/-1; }
.field-help { color: #8b9991; font-size: 8px; font-weight: 500; }
.form-actions { display: flex; align-items: center; gap: 8px; margin-top: 1px; }
.form-message { min-height: 13px; color: #357d50; font-size: 9px; font-weight: 700; }
.form-message.error { color: #b33742; }
.entity-list { display: grid; }
.entity-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #edf1ee; }
.entity-row:last-child { border-bottom: 0; }
.entity-main { min-width: 0; flex: 1; }
.entity-main b, .entity-main span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entity-main b { font-size: 10px; }
.entity-main span, .entity-meta { color: var(--muted); font-size: 8px; }
.entity-meta { white-space: nowrap; }
.table-scroll { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
.data-table th { padding: 9px 8px; border-bottom: 1px solid var(--line); color: #82938a; background: #fbfcfb; text-align: left; font-size: 8px; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
.data-table td { padding: 9px 8px; border-bottom: 1px solid #edf1ee; color: #476055; font-size: 9px; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover td { background: #f9fcfa; }
.person-link { display: inline-flex; align-items: center; gap: 8px; font-size: 9px; }
.player-avatar { display: grid; flex: 0 0 38px; width: 38px; height: 38px; place-items: center; overflow: hidden; border: 1px solid #dce9df; border-radius: 50%; color: #397654; background: #e9f4ec; font-family: Manrope,sans-serif; font-size: 10px; font-weight: 850; }
.player-avatar img { width: 100%; height: 100%; object-fit: cover; }
.player-avatar.small { flex-basis: 26px; width: 26px; height: 26px; font-size: 8px; }
.player-avatar.large { flex-basis: 62px; width: 62px; height: 62px; font-size: 15px; }
.empty-state { display: grid; justify-items: center; gap: 5px; padding: 25px 12px; text-align: center; }
.empty-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; color: #5b9470; background: #edf6ef; font-size: 17px; }
.empty-state h3 { margin: 3px 0 0; font-family: Manrope,sans-serif; font-size: 12px; }
.empty-state p { max-width: 350px; margin: 0 0 8px; color: var(--muted); font-size: 9px; line-height: 1.5; }
.match-create-card { max-width: 860px; }
.match-form { grid-template-columns: repeat(3,minmax(0,1fr)); }
.match-card { padding: 13px; border: 1px solid #e6ede8; border-radius: 9px; }
.match-card-meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 8px; }
.match-card-teams { display: grid; grid-template-columns: minmax(0,1fr) 74px minmax(0,1fr); align-items: center; gap: 8px; margin: 13px 0; }
.match-side { display: flex; min-width: 0; align-items: center; gap: 9px; }
.match-side > div { min-width: 0; }
.match-side b, .match-side small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.match-side b { font-size: 10px; }
.match-side small { margin-top: 3px; color: #8a9a91; font-size: 7px; font-weight: 800; letter-spacing: .1em; }
.match-side.visitor { flex-direction: row-reverse; text-align: right; }
.match-score { text-align: center; font-family: Manrope,sans-serif; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
.match-score i { color: #9bae9f; font-size: 11px; font-style: normal; }
.match-score.pending { color: #749184; font-size: 12px; }
.match-card-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 9px; border-top: 1px solid #edf1ee; }
.match-card-footer > small { color: #82938a; font-size: 8px; }
.player-identity { display: flex; align-items: center; gap: 14px; padding: 17px; margin-bottom: 13px; }
.identity-main { flex: 1; }
.identity-main h2 { margin: 0; font-family: Manrope,sans-serif; font-size: 17px; }
.identity-main p { margin: 5px 0 0; color: var(--muted); font-size: 9px; }
.profile-stats-grid { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 9px; margin-bottom: 13px; }
.profile-stat { padding: 11px; }
.profile-stat span, .profile-stat strong, .profile-stat small { display: block; }
.profile-stat span { color: #819188; font-size: 8px; font-weight: 750; }
.profile-stat strong { margin: 3px 0; font-family: Manrope,sans-serif; font-size: 20px; }
.profile-stat small { color: #62876f; font-size: 8px; }
.detail-stats-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 8px; }
.detail-stat { padding: 9px; border: 1px solid #ebf0ec; border-radius: 8px; }
.detail-stat span, .detail-stat b, .detail-stat small { display: block; }
.detail-stat span { color: var(--muted); font-size: 8px; }
.detail-stat b { margin: 4px 0 1px; color: #304e40; font-size: 12px; }
.detail-stat small { color: #80948a; font-size: 8px; }
.live-match-console { --console-ink:#edf5fb; --console-muted:#91a8b9; --console-line:#1d394e; padding: 13px; border: 1px solid #102b3e; border-radius: 16px; color: var(--console-ink); background: radial-gradient(ellipse at 50% -25%,#173957 0,#0b2030 45%,#071522 100%); box-shadow: 0 18px 40px #0a1d2c20; }
.live-match-console .card { border-color: var(--console-line); color: var(--console-ink); background: linear-gradient(145deg,#0d2232,#091a28); box-shadow: 0 6px 20px #020a121f; }
.live-scoreboard { display: grid; grid-template-columns: minmax(0,1fr) 225px minmax(0,1fr); align-items: center; gap: 10px; padding: 13px; margin-bottom: 12px; border-radius: 12px; background: linear-gradient(105deg,#0b2440,#081724 50%,#2a1420) !important; }
.score-side { display: flex; min-width: 0; align-items: center; gap: 13px; }
.score-team-meta { display: flex; min-width: 0; flex: 1; align-items: center; gap: 9px; }
.score-team-meta > div { min-width: 0; }
.score-team-meta span, .score-team-meta strong, .score-team-meta small { display: block; }
.score-team-meta span { color: #829aae; font-size: 8px; font-weight: 850; letter-spacing: .12em; }
.score-team-meta strong { overflow: hidden; margin: 3px 0; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.score-team-meta small { color: #9bb0c0; font-size: 9px; }
.score-team-meta small b { padding-left: 4px; color: #fff; font-size: 11px; }
.score-side .team-mark { border-color: color-mix(in srgb,var(--team-color,#176b52) 65%,white); color: var(--team-color,#176b52); background: #f2f8fb; }
.score-side .score-value { color: #24a7f4; font-family: Manrope,sans-serif; font-size: clamp(32px,4vw,48px); font-variant-numeric: tabular-nums; line-height: 1; }
.away-score-side { flex-direction: row-reverse; text-align: right; }
.away-score-side .score-team-meta { flex-direction: row-reverse; }
.away-score-side .score-value { color: #fa5267; }
.score-center { display: grid; justify-items: center; padding: 2px 8px; border-right: 1px solid #315068; border-left: 1px solid #315068; }
.quarter-label { color: #a9c2d5; font-size: 9px; font-weight: 850; letter-spacing: .11em; text-transform: uppercase; }
.score-center > strong { margin: 2px 0; color: #fff; font-family: Manrope,sans-serif; font-size: 31px; font-variant-numeric: tabular-nums; }
.clock-state { color: #91a8b9; font-size: 8px; }
.score-controls { display: flex; gap: 4px; margin-top: 7px; }
.score-controls .button { min-height: 27px; padding: 4px 7px; border-color: #2d4b62; color: #dceaf5; background: #112a3d; font-size: 8px; }
.score-controls .button-primary { border-color: #0789dc; color: white; background: #087dd0; }
.score-controls .button-warning { border-color: #d5aa3b; color: #fff3c8; background: #8e6818; }
.live-columns { display: grid; grid-template-columns: minmax(0,.95fr) minmax(360px,1.15fr) minmax(0,.95fr); align-items: start; gap: 12px; }
.live-roster, .live-center-column { min-width: 0; }
.live-roster { overflow: hidden; border-top: 3px solid var(--roster-color,#176b52) !important; }
.live-roster-head { display: flex; align-items: center; gap: 9px; padding: 12px 11px; border-bottom: 1px solid var(--console-line); }
.live-roster-head div { min-width: 0; }
.live-roster-head div b, .live-roster-head div small { display: block; }
.live-roster-head div b { overflow: hidden; font-family: Manrope,sans-serif; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.live-roster-head div small { margin-top: 4px; color: var(--console-muted); font-size: 8px; font-weight: 800; letter-spacing: .07em; }
.live-roster-table { width: 100%; border-collapse: collapse; }
.live-roster-table th { padding: 8px 4px; border-bottom: 1px solid var(--console-line); color: #a2b8c8; background: #10283a; text-align: center; font-size: 8px; font-weight: 850; }
.live-roster-table th:nth-child(2) { text-align: left; }
.live-roster-table td { padding: 6px 3px; border-bottom: 1px solid #142d40; color: #d0deea; text-align: center; font-size: 9px; font-variant-numeric: tabular-nums; }
.live-roster-table tbody tr.selected td { background: color-mix(in srgb,var(--roster-color,#176b52) 22%,#0c1e2d); }
.live-roster-table tfoot th, .live-roster-table tfoot td { padding: 8px 3px; border-top: 1px solid #315068; color: #eaf4fc; background: #10283a; font-size: 9px; font-weight: 850; }
.live-roster-table tfoot th { text-align: left; }
.live-player-select { display: grid; width: 100%; padding: 1px; border: 0; color: inherit; background: transparent; text-align: left; }
.live-player-select b { overflow: hidden; color: #edf5fb; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.live-player-select small { margin-top: 3px; color: #9bb0c0; font-size: 7px; }
.lineup-toggle { width: 21px; height: 21px; padding: 0; border: 1px solid #35536a; border-radius: 6px; color: #9aafbe; background: #11283a; font-size: 10px; }
.lineup-toggle.on { border-color: var(--roster-color,#176b52); color: white; background: var(--roster-color,#176b52); }
.live-roster-foot { padding: 8px 9px; color: #91a8b9; font-size: 8px; }
.live-center-column { display: grid; gap: 10px; }
.live-court-card, .live-actions-card, .selected-live-player, .period-score-card, .recent-events-card { padding: 13px; }
.court-card-heading { display: flex; align-items: end; justify-content: space-between; gap: 8px; margin-bottom: 10px; }

.fixture-team.is-winner > b { color: #152544; font-weight: 900; }
.fixture-bye { border-style: dashed; background: #fafbfe; }
.fixture-winner { display: block; padding-top: 6px; border-top: 1px solid #f0f2f6; color: #32805e; font-size: 8px; font-weight: 800; }
.series-score { color: #5367c2; font-size: 9px; font-weight: 900; letter-spacing: .05em; }
.series-score i { color: #9ca8c1; font-style: normal; }
.fixture-matches { display: grid; gap: 6px; margin-top: 7px; }
.tournament-game-row { display: grid; grid-template-columns: 1fr auto; gap: 5px 8px; padding: 7px; border: 1px solid #edf0f6; border-radius: 8px; background: #fbfcff; }
.tournament-game-tag { display: flex; align-items: center; grid-column: 1/-1; color: #8390a5; font-size: 7px; font-weight: 900; letter-spacing: .08em; }
.tournament-game-tag i { width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: #ec5868; box-shadow: 0 0 0 3px #ec58681c; }
.tournament-game-teams { display: grid; min-width: 0; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 4px; }
.tournament-game-teams > span { display: flex; min-width: 0; align-items: center; gap: 4px; }
.tournament-game-teams > span:last-child { justify-content: flex-end; }
.tournament-game-teams b { overflow: hidden; color: #45546d; font-size: 7px; text-overflow: ellipsis; white-space: nowrap; }
.tournament-game-teams strong { color: #182743; font-size: 8px; white-space: nowrap; }
.tournament-game-row .button { min-height: 25px; align-self: center; padding: 4px 7px; font-size: 7px; }
.tournament-final-waiting { display: flex; align-items: center; gap: 10px; padding: 18px; border: 1px dashed #d9dfef; border-radius: 11px; color: #7e8ba1; background: #fafbfe; }
.tournament-final-waiting > span { font-size: 23px; }
.tournament-final-waiting b, .tournament-final-waiting small { display: block; }
.tournament-final-waiting b { color: #34445e; font-size: 10px; }
.tournament-final-waiting small { margin-top: 4px; font-size: 8px; }
.tournament-participant-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(190px,1fr)); gap: 8px; }
.tournament-participant { display: flex; min-width: 0; align-items: center; gap: 8px; padding: 9px; border: 1px solid #e9edf4; border-radius: 10px; background: #fbfcff; }
.tournament-participant > div { display: grid; min-width: 0; gap: 3px; }
.tournament-participant b { overflow: hidden; color: #25344e; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.tournament-participant small { overflow: hidden; color: #8793a7; font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 1100px) {

  .profile-stats-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }

  .local-chip { margin-left: auto; }

  .page-heading { align-items: flex-start; flex-direction: column; gap: 12px; margin-bottom: 16px; }

  .summary-card { padding: 11px; }

  .two-column-layout { grid-template-columns: 1fr; gap: 10px; }
  .match-form { grid-template-columns: 1fr 1fr; }

  .match-row, .compact-list .match-row { grid-template-columns: 1fr auto; gap: 7px; }
  .match-date { grid-column: 1; }
  .match-teams { grid-column: 1/-1; grid-row: 2; }

  .detail-stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }

  .live-scoreboard { grid-template-columns: minmax(0,1fr) 112px minmax(0,1fr); gap: 4px; padding: 8px 5px; }
  .score-side { display: grid; justify-items: center; gap: 4px; text-align: center; }
  .score-team-meta { display: grid; justify-items: center; gap: 3px; }
  .score-team-meta > div { width: 100%; }
  .score-team-meta span { font-size: 7px; }
  .score-team-meta strong { font-size: 8px; }
  .score-team-meta small { font-size: 7px; }

  .tournament-dashboard-banner { flex-wrap: wrap; }
  .tournament-dashboard-banner > .button { margin-left: 52px; }
  .tournament-participant-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }

/* Supabase access and shared workspace screens */
.access-screen { min-height: 100vh; display: grid; place-items: center; padding: 26px 16px; background: radial-gradient(ellipse at 15% 10%, #dbefe7 0, transparent 38%), #f4f7f5; }
.access-card { width: min(100%, 440px); padding: 30px; border: 1px solid #dfe8e2; border-radius: 20px; background: #fff; box-shadow: 0 24px 70px #163a2a12; }
.access-loading { text-align: center; }
.access-loading h1 { margin: 18px 0 4px; font: 800 18px Manrope, sans-serif; letter-spacing: .04em; }
.access-loading p { color: #758078; font-size: 13px; }
.access-spinner { display: inline-block; width: 22px; height: 22px; margin-top: 14px; border: 2px solid #d9e9df; border-top-color: #176b52; border-radius: 50%; animation: ec-spin .75s linear infinite; }
@keyframes ec-spin { to { transform: rotate(360deg); } }
.access-brand { display: inline-flex; align-items: center; gap: 10px; color: #10251b; text-decoration: none; }
.access-brand b, .access-brand small { display: block; }
.access-brand b { font: 800 11px Manrope, sans-serif; letter-spacing: .06em; }
.access-brand small { margin-top: 3px; color: #78877f; font-size: 8px; letter-spacing: .12em; }
.access-heading { margin: 30px 0 20px; }
.access-heading .eyebrow, .workspace-management .eyebrow { color: #56806a; font-size: 9px; font-weight: 800; letter-spacing: .13em; }
.access-heading h1 { margin: 8px 0 6px; color: #17231c; font: 800 25px Manrope, sans-serif; }
.access-heading p, .workspace-management .section-header p { margin: 0; color: #718078; font-size: 12px; line-height: 1.6; }
.access-form { display: grid; gap: 14px; }
.access-form .field { display: grid; gap: 7px; color: #37473e; font-size: 11px; font-weight: 700; }
.access-form input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid #dbe4de; border-radius: 9px; background: #fbfdfb; color: #17231c; font: inherit; }
.access-form input:focus, .workspace-gate input:focus, .workspace-gate select:focus { outline: 2px solid #8cc5a3; outline-offset: 1px; }
.access-submit { width: 100%; min-height: 44px; margin-top: 4px; }
.access-message { min-height: 18px; margin: 0; color: #2a6b43; font-size: 11px; line-height: 1.5; }
.access-message.error, .form-message.error { color: #b33337; }
.access-actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.access-link { padding: 4px 0; border: 0; background: transparent; color: #176b52; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer; }
.access-link:hover { text-decoration: underline; }
.access-footnote { margin: 22px 0 0; padding-top: 15px; border-top: 1px solid #edf1ee; color: #87928b; font-size: 10px; line-height: 1.6; }
.workspace-screen { align-items: start; padding-top: clamp(24px, 7vh, 70px); }
.workspace-gate { width: min(100%, 760px); }
.gate-topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.workspace-list { display: grid; gap: 9px; margin: 20px 0 26px; }
.workspace-choice { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border: 1px solid #e1e9e4; border-radius: 12px; background: #fff; text-align: left; cursor: pointer; }
.workspace-choice:hover { border-color: #90bca0; background: #f8fcf9; }
.workspace-choice-mark, .member-avatar { display: grid; place-items: center; flex: 0 0 38px; width: 38px; height: 38px; border-radius: 11px; background: #e9f3ec; color: #176b52; font: 800 14px Manrope, sans-serif; }
.workspace-choice-copy, .member-copy { min-width: 0; flex: 1; }
.workspace-choice-copy b, .workspace-choice-copy small, .member-copy b, .member-copy small { display: block; }
.workspace-choice-copy b, .member-copy b { overflow: hidden; color: #23342a; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.workspace-choice-copy small, .member-copy small { margin-top: 4px; color: #7b8980; font-size: 10px; }
.workspace-arrow { color: #518265; font-size: 20px; }
.workspace-empty { display: grid; gap: 5px; margin: 18px 0; padding: 16px; border: 1px dashed #d8e4db; border-radius: 12px; color: #52645a; font-size: 11px; }
.workspace-empty span { color: #829087; line-height: 1.5; }
.workspace-create { margin-top: 22px; padding-top: 20px; border-top: 1px solid #edf1ee; }
.workspace-create h2 { margin: 0 0 14px; color: #293a30; font: 800 14px Manrope, sans-serif; }
.workspace-gate .field { display: grid; gap: 7px; color: #37473e; font-size: 11px; font-weight: 700; }
.workspace-gate input:not([type=checkbox]), .workspace-gate select { min-height: 42px; padding: 0 11px; border: 1px solid #dbe4de; border-radius: 8px; background: #fbfdfb; color: #17231c; font: inherit; }
.workspace-import { display: flex !important; align-items: flex-start; gap: 9px !important; color: #58685e !important; font-size: 10px !important; font-weight: 500 !important; line-height: 1.5; }
.workspace-import input { margin: 2px 0 0; accent-color: #176b52; }
.workspace-management { margin-bottom: 20px; }
.workspace-management .section-header { margin-bottom: 14px; }
.workspace-management .section-header h2 { margin: 5px 0; color: #17231c; font: 800 20px Manrope, sans-serif; }
.workspace-management .section-header h3 { margin: 0 0 4px; color: #26372c; font: 800 13px Manrope, sans-serif; }
.workspace-permissions { display: flex; gap: 10px 22px; flex-wrap: wrap; margin: 17px 0 22px; padding: 12px 14px; border: 1px solid #deebe2; border-radius: 10px; background: #f6fbf7; color: #5d6d62; font-size: 10px; }
.workspace-permissions b { color: #176b52; }
.workspace-management-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(260px, .9fr); gap: 28px; }
.member-list { display: grid; gap: 8px; }
.member-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid #edf1ee; border-radius: 10px; }
.member-avatar { flex-basis: 32px; width: 32px; height: 32px; border-radius: 50%; font-size: 12px; }
.invite-form { display: grid; gap: 12px; }
.invite-result { margin-top: 13px; padding: 13px; border: 1px solid #c9e2d0; border-radius: 10px; background: #f4fbf6; }
.invite-result[hidden] { display: none; }
.invite-result label { display: block; margin-bottom: 7px; color: #54705e; font-size: 10px; font-weight: 700; }
.invite-result input { width: 100%; min-height: 37px; padding: 8px; border: 1px solid #d7e4db; border-radius: 7px; color: #435349; font-size: 10px; }
.invite-result button { margin-top: 8px; }
.topbar-account { display: flex; align-items: center; gap: 7px; }
.topbar-account > span { max-width: 190px; overflow: hidden; color: #66756c; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.cloud-indicator { background: #49ad69 !important; box-shadow: 0 0 0 4px #49ad6924; }
.muted { color: #7a8980; font-size: 11px; }
@media (max-width: 760px) {
  .access-card { padding: 22px; }
  .workspace-management-grid { grid-template-columns: 1fr; }
  .topbar { justify-content: space-between; }
  .topbar-account > span { display: none; }
  .topbar-account .button { padding: 7px 8px; font-size: 9px; }
}
@media (max-width: 430px) {
  .local-chip { padding: 5px 7px; font-size: 7px; }
  .match-card-teams { grid-template-columns: minmax(0,1fr) 50px minmax(0,1fr); gap: 4px; }
  .match-side { gap: 5px; }
  .match-side .team-mark { width: 29px; height: 29px; flex-basis: 29px; }
  .match-side b { font-size: 8px; }
  .score-team-meta small { display: none; }
  .live-action-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
  .section-card, .content-card { padding: 13px; }
  .tournament-intro { min-height: 0; padding: 18px 15px; }
  .tournament-intro-ball { position: absolute; right: -7px; bottom: 8px; width: 48px; height: 48px; border: 0; background: none; box-shadow: none; opacity: .55; font-size: 29px; }
  .tournament-intro-copy { position: relative; z-index: 2; }
  .tournament-format-chips span { padding: 5px 7px; font-size: 7px; }
  .tournament-create-card, .tournament-list-card { padding: 13px; }
  .tournament-team-picker { grid-template-columns: 1fr; }
  .tournament-rules { display: grid; }
  .tournament-detail-hero { flex-direction: column; padding: 14px; }
  .tournament-progress { width: 100%; grid-template-columns: auto 1fr; align-items: end; justify-items: start; column-gap: 8px; }
  .tournament-progress > div { grid-column: 1/-1; }
  .tournament-participant-grid { grid-template-columns: 1fr; }
  .tournament-bracket { grid-auto-columns: minmax(215px,80vw); }
  .tournament-game-teams { grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); }
}

/* Neon night theme: Estadísticas Chile */
:root {
  color-scheme: dark;
  --ink: #f7f2ff;
  --ink-2: #d8cce9;
  --muted: #aa9fba;
  --muted-light: #796f8d;
  --line: rgba(191, 119, 255, .2);
  --paper: rgba(19, 12, 34, .88);
  --canvas: #08060f;
  --green: #bb4bff;
  --green-dark: #8630e8;
  --green-soft: rgba(187, 75, 255, .15);
  --blue: #6b9cff;
  --red: #ff527a;
  --shadow: 0 18px 45px rgba(0, 0, 0, .3);
  background: var(--canvas);
}

body {
  color: var(--ink);
  background:
    radial-gradient(900px 540px at 84% -12%, rgba(136, 43, 236, .28), transparent 63%),
    radial-gradient(650px 520px at -10% 58%, rgba(53, 70, 211, .18), transparent 65%),
    #08060f;
}

input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
  outline-color: rgba(224, 104, 255, .8);
}

.sidebar {
  border-right: 1px solid rgba(207, 132, 255, .15);

    radial-gradient(300px 330px at 0 0, rgba(162, 45, 255, .27), transparent 70%),

  box-shadow: 14px 0 38px rgba(0, 0, 0, .27);
}
.brand-mark {

  "src/data/repository.js": function(exports, require) {
const { emptyStore, STORAGE_KEY } = require("src/data/schema.js");
const { loadWorkspaceDocument, saveWorkspaceDocument, subscribeToWorkspace } = require("src/data/workspace-api.js");
let storageKey = STORAGE_KEY;
let cloudWorkspace = null;

function cloneStore(data) {
  return JSON.parse(JSON.stringify(data));
}

function normalizeStore(data) {
  return {
    version: 1,
    teams: Array.isArray(data?.teams) ? data.teams : [],
    players: Array.isArray(data?.players) ? data.players : [],
    matches: Array.isArray(data?.matches) ? data.matches : [],
    tournaments: Array.isArray(data?.tournaments) ? data.tournaments : []
  };
}

function dispatchSyncEvent(name, detail = {}) {
  window.dispatchEvent(new CustomEvent(name, { detail }));
}

function storeDocument(documentData) {
  try { localStorage.setItem(storageKey, JSON.stringify(normalizeStore(documentData))); }
  catch { /* A remote workspace remains the source of truth if local cache is unavailable. */ }
}

async function refreshWorkspace(ctx, reason = 'remote') {
  if (ctx.refreshing || ctx !== cloudWorkspace) return;
  ctx.refreshing = true;
  try {
    const latest = await loadWorkspaceDocument(ctx.client, ctx.workspaceId);
    if (ctx !== cloudWorkspace) return;
    if (latest.revision > ctx.revision) {
      ctx.revision = latest.revision;
      storeDocument(latest.document);
      dispatchSyncEvent('ec:workspace-change', { reason, revision: latest.revision });
    }
  } finally {
    ctx.refreshing = false;
    ctx.syncBlocked = false;
  }
}

function queueWorkspaceSave(snapshot) {
  const ctx = cloudWorkspace;
  if (!ctx) return;
  const generation = ctx.generation;
  ctx.pending += 1;
  ctx.queue = ctx.queue.then(async () => {
    if (ctx !== cloudWorkspace || generation !== ctx.generation) return;
    const result = await saveWorkspaceDocument(ctx.client, ctx.workspaceId, ctx.revision, snapshot);
    if (ctx !== cloudWorkspace || generation !== ctx.generation) return;
    if (result?.saved) {
      ctx.revision = Number(result.current_revision);
      dispatchSyncEvent('ec:workspace-saved', { revision: ctx.revision });
      return;
    }

    ctx.generation += 1;
    ctx.syncBlocked = true;
    await refreshWorkspace(ctx, 'conflict');
    dispatchSyncEvent('ec:workspace-conflict', { revision: ctx.revision });
  }).catch(error => {
    dispatchSyncEvent('ec:workspace-error', { message: error.message || 'No se pudo sincronizar con Supabase.' });
  }).finally(() => {
    ctx.pending = Math.max(0, ctx.pending - 1);
  });
}

function activateWorkspaceStore({ client, workspaceId, role, revision, document: remoteDocument }) {
  deactivateWorkspaceStore();
  storageKey = `${STORAGE_KEY}:workspace:${workspaceId}`;
  const remoteChannel = subscribeToWorkspace(client, workspaceId, payload => {
    if (cloudWorkspace?.pending) return;
    const incomingRevision = Number(payload?.new?.revision || 0);
    if (incomingRevision > (cloudWorkspace?.revision || 0)) void refreshWorkspace(cloudWorkspace, 'remote');
  });
  cloudWorkspace = {
    client, workspaceId, role, revision: Number(revision) || 0,
    queue: Promise.resolve(), pending: 0, generation: 0, syncBlocked: false, remoteChannel
  };
  storeDocument(remoteDocument);
}

function deactivateWorkspaceStore() {
  const previous = cloudWorkspace;
  cloudWorkspace = null;
  storageKey = STORAGE_KEY;
  if (previous?.remoteChannel) void previous.client.removeChannel(previous.remoteChannel);
}

function replaceActiveStore(documentData, { sync = false } = {}) {
  const normalized = normalizeStore(documentData);
  storeDocument(normalized);
  if (sync) queueWorkspaceSave(cloneStore(normalized));
}

function hasLocalData() {
  const local = readStore();
  return Boolean(local.teams.length || local.players.length || local.matches.length || local.tournaments.length);
}

function readStore() {
  try {
    const saved = localStorage.getItem(storageKey);
    if (!saved) return emptyStore();
    const data = JSON.parse(saved);
    if (data.version !== 1 || !Array.isArray(data.teams) || !Array.isArray(data.players) || !Array.isArray(data.matches)) {
      return emptyStore();
    }
    // Keep existing V1 browser data when upgrading from a build without tournaments.
    if (!Array.isArray(data.tournaments)) data.tournaments = [];
    return data;
  } catch {
    return emptyStore();
  }
}

function writeStore(data) {
  try {
    localStorage.setItem(storageKey, JSON.stringify(data));
    return { ok: true };
  } catch {
    return { ok: false, error: 'No se pudieron guardar los datos. Puede que el almacenamiento del navegador esté lleno.' };
  }
}

function updateStore(mutator, { sync = true } = {}) {
  if (sync && cloudWorkspace?.role === 'viewer') throw new Error('Tu perfil permite consultar los datos, pero no modificarlos.');
  if (sync && cloudWorkspace?.syncBlocked) throw new Error('El equipo recibió cambios nuevos. Espera un instante y vuelve a intentar.');
  const data = readStore();
  const result = mutator(data);
  const saved = writeStore(data);
  if (!saved.ok) throw new Error(saved.error);
  if (sync && cloudWorkspace) queueWorkspaceSave(cloneStore(data));
  return result;
}

function makeId(prefix) {
  const randomId = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  return `${prefix}-${randomId}`;
}

function getTeam(id) {
  return readStore().teams.find(team => team.id === id) || null;
}

function getPlayer(id) {
  return readStore().players.find(player => player.id === id) || null;
}

function getMatch(id) {
  return readStore().matches.find(match => match.id === id) || null;
}


Object.assign(exports, { activateWorkspaceStore, deactivateWorkspaceStore, replaceActiveStore, hasLocalData, readStore, writeStore, updateStore, makeId, getTeam, getPlayer, getMatch });
  },

  "src/domain/matches.js": function(exports, require) {
const { emptyStats } = require("src/domain/statistics.js");
const { makeId } = require("src/data/repository.js");
const GAME_SECONDS = 10 * 60;
const OVERTIME_SECONDS = 5 * 60;

const ACTIONS = {
  point1: { label: 'Punto manual (+1)', short: '+1', points: 1 },
  twoMade: { label: 'Doble convertido', short: '+2', points: 2 },
  threeMade: { label: 'Triple convertido', short: '+3', points: 3 },
  freeThrowMade: { label: 'Tiro libre convertido', short: 'TL +', points: 1 },
  freeThrowMissed: { label: 'Tiro libre fallado', short: 'TL —', points: 0 },
  twoMissed: { label: 'Doble fallado', short: '2P —', points: 0 },
  threeMissed: { label: 'Triple fallado', short: '3P —', points: 0 },
  offRebound: { label: 'Rebote ofensivo', short: 'RO', points: 0 },
  defRebound: { label: 'Rebote defensivo', short: 'RD', points: 0 },
  assist: { label: 'Asistencia', short: 'AS', points: 0 },
  steal: { label: 'Robo', short: 'ROB', points: 0 },
  block: { label: 'Tapón', short: 'TAP', points: 0 },
  turnover: { label: 'Pérdida', short: 'PER', points: 0 },
  foul: { label: 'Falta', short: 'FAL', points: 0 }
};

function newMatch({ homeTeamId, awayTeamId, date }, teams) {
  if (!homeTeamId || !awayTeamId) throw new Error('Selecciona los dos equipos.');
  if (homeTeamId === awayTeamId) throw new Error('El equipo local y el visitante deben ser distintos.');
  const home = teams.find(team => team.id === homeTeamId);
  const away = teams.find(team => team.id === awayTeamId);
  if (!home || !away) throw new Error('No encontramos uno de los equipos seleccionados.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '') || Number.isNaN(new Date(`${date}T12:00:00`).getTime())) {
    throw new Error('Selecciona una fecha válida para el partido.');
  }
  return {
    id: makeId('match'), homeTeamId, awayTeamId, date,
    status: 'scheduled', quarter: 1, clockSeconds: GAME_SECONDS,
    score: { home: 0, away: 0 },
    periodScores: { home: [0, 0, 0, 0], away: [0, 0, 0, 0] },
    teamFouls: { home: [0, 0, 0, 0], away: [0, 0, 0, 0] },
    players: [], events: [], selectedPlayerId: null,
    createdAt: new Date().toISOString()
  };
}

function startMatch(match, teams, players) {
  if (match.status !== 'scheduled') throw new Error('Este partido ya fue iniciado o finalizado.');
  const homeRoster = players.filter(player => player.teamId === match.homeTeamId);
  const awayRoster = players.filter(player => player.teamId === match.awayTeamId);
  if (homeRoster.length < 5 || awayRoster.length < 5) {
    throw new Error('Para iniciar un partido 5×5, cada equipo necesita al menos cinco jugadores asignados.');
  }
  const homeTeam = teams.find(team => team.id === match.homeTeamId);
  const awayTeam = teams.find(team => team.id === match.awayTeamId);
  if (!homeTeam || !awayTeam) throw new Error('Uno de los equipos ya no existe.');

  const snapshotRoster = (roster, teamId) => roster
    .slice()
    .sort((a, b) => Number(a.number) - Number(b.number))
    .map((player, index) => ({
      playerId: player.id,
      teamId,
      displayName: player.name,
      number: player.number,
      position: player.position,
      photo: player.photo || '',
      onCourt: index < 5,
      secondsPlayed: 0,
      stats: emptyStats()
    }));

  match.players = [
    ...snapshotRoster(homeRoster, 'home'),
    ...snapshotRoster(awayRoster, 'away')
  ];
  match.selectedPlayerId = match.players.find(player => player.teamId === 'home')?.playerId || null;
  match.status = 'live';
  match.startedAt = new Date().toISOString();
  return match;
}

function recordAction(match, type, playerId) {
  if (match.status !== 'live') throw new Error('El partido no está en curso.');
  if (!ACTIONS[type]) throw new Error('Acción estadística desconocida.');
  const player = match.players.find(line => line.playerId === playerId);
  if (!player) throw new Error('Selecciona un jugador de este partido.');
  match.events.push({
    id: makeId('event'), type, playerId, teamId: player.teamId,
    quarter: match.quarter, clockSeconds: match.clockSeconds,
    createdAt: new Date().toISOString()
  });
  applyAction(match, match.events.at(-1));
  return match;
}

function applyAction(match, event) {
  const line = match.players.find(player => player.playerId === event.playerId);
  if (!line) return;
  const stats = line.stats;
  const team = event.teamId;
  const quarterIndex = Math.max(0, event.quarter - 1);
  ensurePeriod(match, quarterIndex);

  switch (event.type) {
    case 'point1': stats.points += 1; break;
    case 'twoMade': stats.points += 2; stats.twoMade += 1; stats.twoAttempted += 1; break;
    case 'threeMade': stats.points += 3; stats.threeMade += 1; stats.threeAttempted += 1; break;
    case 'freeThrowMade': stats.points += 1; stats.freeThrowsMade += 1; stats.freeThrowsAttempted += 1; break;
    case 'freeThrowMissed': stats.freeThrowsAttempted += 1; break;
    case 'twoMissed': stats.twoAttempted += 1; break;
    case 'threeMissed': stats.threeAttempted += 1; break;
    case 'offRebound': stats.offRebounds += 1; break;
    case 'defRebound': stats.defRebounds += 1; break;
    case 'assist': stats.assists += 1; break;
    case 'steal': stats.steals += 1; break;
    case 'block': stats.blocks += 1; break;
    case 'turnover': stats.turnovers += 1; break;
    case 'foul': stats.fouls += 1; match.teamFouls[team][quarterIndex] += 1; break;
  }
  const points = ACTIONS[event.type].points;
  match.score[team] += points;
  match.periodScores[team][quarterIndex] += points;
}

function ensurePeriod(match, index) {
  for (const team of ['home', 'away']) {
    while (match.periodScores[team].length <= index) match.periodScores[team].push(0);
    while (match.teamFouls[team].length <= index) match.teamFouls[team].push(0);
  }
}

function undoLastAction(match) {
  if (match.status !== 'live' || !match.events.length) return false;
  match.events.pop();
  const secondsByPlayer = new Map(match.players.map(player => [player.playerId, player.secondsPlayed]));
  match.score = { home: 0, away: 0 };
  const periodCount = Math.max(4, match.quarter, ...match.periodScores.home.map((_, index) => index + 1));
  match.periodScores = { home: Array(periodCount).fill(0), away: Array(periodCount).fill(0) };
  match.teamFouls = { home: Array(periodCount).fill(0), away: Array(periodCount).fill(0) };
  for (const player of match.players) {
    player.stats = emptyStats();
    player.secondsPlayed = secondsByPlayer.get(player.playerId) || 0;
  }
  for (const event of match.events) applyAction(match, event);
  return true;
}

function toggleOnCourt(match, playerId) {
  if (match.status !== 'live') throw new Error('El partido no está en curso.');
  const line = match.players.find(player => player.playerId === playerId);
  if (!line) throw new Error('Jugador no encontrado.');
  const onCourt = match.players.filter(player => player.teamId === line.teamId && player.onCourt);
  if (!line.onCourt && onCourt.length >= 5) throw new Error('Ya hay cinco jugadores en cancha. Quita uno antes de hacer el cambio.');
  line.onCourt = !line.onCourt;
  return line.onCourt;
}

function advanceQuarter(match, direction = 1) {
  if (match.status !== 'live') throw new Error('El partido no está en curso.');
  match.quarter = Math.max(1, match.quarter + direction);
  match.clockSeconds = match.quarter > 4 ? OVERTIME_SECONDS : GAME_SECONDS;
  ensurePeriod(match, match.quarter - 1);
  return match;
}

function finalizeMatch(match) {
  if (match.status !== 'live') throw new Error('Solo se puede finalizar un partido en curso.');
  match.status = 'final';
  match.clockRunning = false;
  match.finishedAt = new Date().toISOString();
  return match;
}

function formatQuarter(quarter) {
  return quarter <= 4 ? `${quarter}° cuarto` : `${quarter - 4}° prórroga`;
}


Object.assign(exports, { ACTIONS, newMatch, startMatch, recordAction, undoLastAction, toggleOnCourt, advanceQuarter, finalizeMatch, formatQuarter });

  "src/domain/statistics.js": function(exports, require) {
const STAT_KEYS = [
  'points', 'twoMade', 'twoAttempted', 'threeMade', 'threeAttempted',
  'freeThrowsMade', 'freeThrowsAttempted', 'offRebounds', 'defRebounds',
  'assists', 'steals', 'blocks', 'turnovers', 'fouls'
];

function emptyStats() {
  return Object.fromEntries(STAT_KEYS.map(key => [key, 0]));
}

function totalRebounds(stats) {
  return Number(stats.offRebounds || 0) + Number(stats.defRebounds || 0);
}

function appeared(line) {
  return Number(line.secondsPlayed || 0) > 0 || STAT_KEYS.some(key => Number(line.stats?.[key] || 0) > 0);
}

function aggregatePlayer(playerId, matches) {
  const totals = { games: 0, secondsPlayed: 0, ...emptyStats() };
  const history = [];

  for (const match of matches) {
    if (match.status !== 'final') continue;
    const line = (match.players || []).find(item => item.playerId === playerId);
    if (!line || !appeared(line)) continue;

    totals.games += 1;
    totals.secondsPlayed += Number(line.secondsPlayed || 0);
    for (const key of STAT_KEYS) totals[key] += Number(line.stats?.[key] || 0);
    history.push({ match, line });
  }

  const perGame = {};
  for (const key of STAT_KEYS) perGame[key] = totals.games ? totals[key] / totals.games : 0;
  perGame.rebounds = totals.games ? totalRebounds(totals) / totals.games : 0;
  perGame.minutes = totals.games ? totals.secondsPlayed / 60 / totals.games : 0;

  return { totals, perGame, history };
}

function formatMinutes(seconds) {
  const safeSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
  const minutes = Math.floor(safeSeconds / 60);
  const remainder = safeSeconds % 60;
  return `${minutes}:${String(remainder).padStart(2, '0')}`;
}

function formatAverage(value, digits = 1) {
  return (Number(value) || 0).toLocaleString('es-CL', {
    minimumFractionDigits: 0,
    maximumFractionDigits: digits
  });
}

function percentage(made, attempted) {
  return attempted ? `${Math.round((made / attempted) * 100)}%` : '—';
}


Object.assign(exports, { STAT_KEYS, emptyStats, totalRebounds, appeared, aggregatePlayer, formatMinutes, formatAverage, percentage });

  "src/domain/tournaments.js": function(exports, require) {
const { makeId } = require("src/data/repository.js");
const { newMatch } = require("src/domain/matches.js");
const TOURNAMENT_FORMATS = {
  playoff: { label: 'Playoff', detail: 'Llaves al mejor de 3 partidos', teams: '2–16 equipos' },
  elimination: { label: 'Eliminación directa', detail: 'Un partido por llave', teams: '2–16 equipos' },
  league: { label: 'Liga', detail: 'Todos contra todos, una rueda', teams: '2–16 equipos' },
  quadrangular: { label: 'Cuadrangular', detail: '4 equipos, fase de grupo y final', teams: 'Exactamente 4 equipos' }
};

function validDate(date) {
  return /^\d{4}-\d{2}-\d{2}$/.test(date || '') && !Number.isNaN(new Date(`${date}T12:00:00`).getTime());
}

function makeRound(name, stage, fixtures) {
  return { id: makeId('round'), name, stage, fixtures };
}

function makeFixture(homeTeamId = null, awayTeamId = null, stage = '') {
  return {
    id: makeId('fixture'), stage, homeTeamId, awayTeamId,
    matchIds: [], wins: {}, winnerTeamId: null,
    status: homeTeamId && awayTeamId ? 'scheduled' : 'waiting'
  };
}

function tournamentMatch(tournament, round, fixture, teams, matches) {
  const gameNumber = fixture.matchIds.length + 1;
  let homeTeamId = fixture.homeTeamId;
  let awayTeamId = fixture.awayTeamId;
  if (tournament.format === 'playoff' && gameNumber % 2 === 0) {
    [homeTeamId, awayTeamId] = [awayTeamId, homeTeamId];
  }
  const match = newMatch({ homeTeamId, awayTeamId, date: tournament.date }, teams);
  Object.assign(match, {
    tournamentId: tournament.id,
    tournamentName: tournament.name,
    tournamentRoundId: round.id,
    tournamentRoundName: round.name,
    tournamentFixtureId: fixture.id,
    tournamentStage: fixture.stage,
    tournamentGameNumber: gameNumber
  });
  fixture.matchIds.push(match.id);
  fixture.status = 'scheduled';
  matches.push(match);
  return match;
}

function roundRobin(teamIds, stage) {
  const rotation = teamIds.slice();
  if (rotation.length % 2) rotation.push(null);
  const rounds = [];
  const roundCount = rotation.length - 1;
  const half = rotation.length / 2;

  for (let roundIndex = 0; roundIndex < roundCount; roundIndex += 1) {
    const fixtures = [];
    for (let gameIndex = 0; gameIndex < half; gameIndex += 1) {
      let home = rotation[gameIndex];
      let away = rotation[rotation.length - 1 - gameIndex];
      if (!home || !away) continue;
      if ((roundIndex + gameIndex) % 2) [home, away] = [away, home];
      fixtures.push(makeFixture(home, away, stage));
    }
    rounds.push(makeRound(`Jornada ${roundIndex + 1}`, stage, fixtures));
    rotation.splice(1, 0, rotation.pop());
  }
  return rounds;
}

function seedOrder(size) {
  let seeds = [1, 2];
  while (seeds.length < size) {
    const nextSeed = seeds.length * 2 + 1;
    seeds = seeds.flatMap(seed => [seed, nextSeed - seed]);
  }
  return seeds;
}

function bracketRoundName(gameCount) {
  if (gameCount === 1) return 'Final';
  if (gameCount === 2) return 'Semifinales';
  if (gameCount === 4) return 'Cuartos de final';
  if (gameCount === 8) return 'Octavos de final';
  return `Ronda de ${gameCount * 2}`;
}

function placeWinner(tournament, roundIndex, fixtureIndex, teams, matches) {
  const round = tournament.rounds[roundIndex];
  const fixture = round.fixtures[fixtureIndex];
  if (!fixture?.winnerTeamId) return;
  if (roundIndex === tournament.rounds.length - 1) {
    tournament.status = 'completed';
    tournament.championTeamId = fixture.winnerTeamId;
    tournament.finishedAt = new Date().toISOString();
    return;
  }

  const nextRound = tournament.rounds[roundIndex + 1];
  const nextFixture = nextRound.fixtures[Math.floor(fixtureIndex / 2)];
  const slot = fixtureIndex % 2 === 0 ? 'homeTeamId' : 'awayTeamId';
  nextFixture[slot] = fixture.winnerTeamId;
  if (nextFixture.homeTeamId && nextFixture.awayTeamId && !nextFixture.matchIds.length) {
    tournamentMatch(tournament, nextRound, nextFixture, teams, matches);
  }
}

function createBracket(tournament, teams, matches) {
  const size = 2 ** Math.ceil(Math.log2(tournament.teamIds.length));
  const slots = Array(size).fill(null);
  seedOrder(size).forEach((seed, slotIndex) => {
    if (seed <= tournament.teamIds.length) slots[slotIndex] = tournament.teamIds[seed - 1];
  });

  for (let gameCount = size / 2; gameCount >= 1; gameCount /= 2) {
    const fixtures = Array.from({ length: gameCount }, () => makeFixture(null, null, 'knockout'));
    tournament.rounds.push(makeRound(bracketRoundName(gameCount), 'knockout', fixtures));
  }

  const firstRound = tournament.rounds[0];
  firstRound.fixtures.forEach((fixture, index) => {
    fixture.homeTeamId = slots[index * 2];
    fixture.awayTeamId = slots[index * 2 + 1];
    if (fixture.homeTeamId && fixture.awayTeamId) {
      tournamentMatch(tournament, firstRound, fixture, teams, matches);
    } else if (fixture.homeTeamId || fixture.awayTeamId) {
      fixture.winnerTeamId = fixture.homeTeamId || fixture.awayTeamId;
      fixture.status = 'bye';
    }
  });

  // Carry first-round byes forward and create any matchups already determined by them.
  for (let roundIndex = 0; roundIndex < tournament.rounds.length - 1; roundIndex += 1) {
    const round = tournament.rounds[roundIndex];
    round.fixtures.forEach((fixture, fixtureIndex) => {
      if (fixture.status === 'bye') placeWinner(tournament, roundIndex, fixtureIndex, teams, matches);
    });
    const nextRound = tournament.rounds[roundIndex + 1];
    nextRound.fixtures.forEach(fixture => {
      if (fixture.homeTeamId && fixture.awayTeamId && !fixture.matchIds.length) {
        tournamentMatch(tournament, nextRound, fixture, teams, matches);
      }
    });
  }
}

function createTournament({ name, format, teamIds, date }, teams) {
  const cleanName = String(name || '').trim();
  const uniqueTeamIds = [...new Set((teamIds || []).map(String).filter(Boolean))];
  if (cleanName.length < 2 || cleanName.length > 60) throw new Error('Escribe un nombre de torneo de entre 2 y 60 caracteres.');
  if (!TOURNAMENT_FORMATS[format]) throw new Error('Selecciona un formato de torneo válido.');
  if (!validDate(date)) throw new Error('Selecciona una fecha válida para el torneo.');
  if (uniqueTeamIds.length < 2 || uniqueTeamIds.length > 16) throw new Error('Selecciona entre 2 y 16 equipos.');
  if (format === 'quadrangular' && uniqueTeamIds.length !== 4) throw new Error('El cuadrangular necesita exactamente cuatro equipos.');
  if (uniqueTeamIds.some(id => !teams.some(team => team.id === id))) throw new Error('Uno de los equipos seleccionados ya no existe.');

  const tournament = {
    id: makeId('tournament'), name: cleanName, format, teamIds: uniqueTeamIds, date,
    status: 'scheduled', rounds: [], createdAt: new Date().toISOString()
  };
  const matches = [];

  if (format === 'playoff' || format === 'elimination') {
    createBracket(tournament, teams, matches);
  } else {
    const stage = format === 'quadrangular' ? 'group' : 'league';
    tournament.rounds = roundRobin(uniqueTeamIds, stage);
    for (const round of tournament.rounds) {
      for (const fixture of round.fixtures) tournamentMatch(tournament, round, fixture, teams, matches);
    }
    if (format === 'quadrangular') {
      const finalRound = makeRound('Final', 'final', [makeFixture(null, null, 'final')]);
      tournament.rounds.push(finalRound);
    }
  }

  return { tournament, matches };
}

function getTournamentStandings(tournament, matches, teams) {
  const standings = tournament.teamIds.map(teamId => ({
    teamId, games: 0, wins: 0, losses: 0, classificationPoints: 0,
    pointsFor: 0, pointsAgainst: 0, pointDifference: 0
  }));
  const byId = new Map(standings.map(row => [row.teamId, row]));
  const groupStages = tournament.format === 'quadrangular' ? ['group'] : ['league'];
  const games = matches.filter(match => match.tournamentId === tournament.id
    && match.status === 'final' && groupStages.includes(match.tournamentStage));

  for (const match of games) {
    const home = byId.get(match.homeTeamId);
    const away = byId.get(match.awayTeamId);
    if (!home || !away) continue;
    home.games += 1;
    away.games += 1;
    home.pointsFor += match.score.home;
    home.pointsAgainst += match.score.away;
    away.pointsFor += match.score.away;
    away.pointsAgainst += match.score.home;
    if (match.score.home > match.score.away) {
      home.wins += 1;
      home.classificationPoints += 2;
      away.losses += 1;
      away.classificationPoints += 1;
    } else {
      away.wins += 1;
      away.classificationPoints += 2;
      home.losses += 1;
      home.classificationPoints += 1;
    }
  }
  standings.forEach(row => { row.pointDifference = row.pointsFor - row.pointsAgainst; });

  const resolveTie = group => {
    if (group.length < 2) return group;
    const tiedIds = group.map(row => row.teamId);
    const tiedSet = new Set(tiedIds);
    const mini = new Map(tiedIds.map(id => [id, { wins: 0, pointsFor: 0, pointsAgainst: 0 }]));
    for (const match of games) {
      if (!tiedSet.has(match.homeTeamId) || !tiedSet.has(match.awayTeamId)) continue;
      const home = mini.get(match.homeTeamId);
      const away = mini.get(match.awayTeamId);
      home.pointsFor += match.score.home;
      home.pointsAgainst += match.score.away;
      away.pointsFor += match.score.away;
      away.pointsAgainst += match.score.home;
      if (match.score.home > match.score.away) home.wins += 1;
      else away.wins += 1;
    }
    const metrics = [
      row => mini.get(row.teamId).wins,
      row => mini.get(row.teamId).pointsFor - mini.get(row.teamId).pointsAgainst,
      row => mini.get(row.teamId).pointsFor,
      row => row.pointDifference,
      row => row.pointsFor
    ];
    for (const metric of metrics) {
      const buckets = new Map();
      for (const row of group) {
        const value = metric(row);
        if (!buckets.has(value)) buckets.set(value, []);
        buckets.get(value).push(row);
      }
      if (buckets.size > 1) {
        return [...buckets.entries()].sort((a, b) => b[0] - a[0])
          .flatMap(([, tiedRows]) => resolveTie(tiedRows));
      }
    }
    return group.slice().sort((a, b) =>
      (teams.find(team => team.id === a.teamId)?.name || '').localeCompare(teams.find(team => team.id === b.teamId)?.name || '', 'es')
    );
  };

  const pointsBuckets = new Map();
  for (const row of standings) {
    if (!pointsBuckets.has(row.classificationPoints)) pointsBuckets.set(row.classificationPoints, []);
    pointsBuckets.get(row.classificationPoints).push(row);
  }
  return [...pointsBuckets.entries()].sort((a, b) => b[0] - a[0]).flatMap(([, group]) => resolveTie(group));
}

function allStageGamesFinal(tournament, matches, stage) {
  const stageMatches = matches.filter(match => match.tournamentId === tournament.id && match.tournamentStage === stage);
  return stageMatches.length > 0 && stageMatches.every(match => match.status === 'final');
}

function updateTournamentAfterMatch(store, match) {
  if (!match.tournamentId) return null;
  if (match.score.home === match.score.away) throw new Error('El partido del torneo está empatado. Avanza a una prórroga y define un ganador antes de finalizarlo.');

  const tournament = store.tournaments.find(item => item.id === match.tournamentId);
  if (!tournament) throw new Error('No encontramos el torneo asociado a este partido.');
  const roundIndex = tournament.rounds.findIndex(round => round.id === match.tournamentRoundId);
  const round = tournament.rounds[roundIndex];
  const fixtureIndex = round?.fixtures.findIndex(fixture => fixture.id === match.tournamentFixtureId) ?? -1;
  const fixture = round?.fixtures[fixtureIndex];
  if (!fixture || !fixture.matchIds.includes(match.id)) throw new Error('No encontramos la llave asociada a este partido.');

  tournament.status = 'inProgress';
  const winnerTeamId = match.score.home > match.score.away ? match.homeTeamId : match.awayTeamId;

  if (match.tournamentStage === 'league') {
    fixture.winnerTeamId = winnerTeamId;
    fixture.status = 'final';
    if (allStageGamesFinal(tournament, store.matches, 'league')) {
      tournament.status = 'completed';
      tournament.championTeamId = getTournamentStandings(tournament, store.matches, store.teams)[0]?.teamId || null;
      tournament.finishedAt = new Date().toISOString();
    }
    return tournament;
  }

  if (match.tournamentStage === 'group') {
    fixture.winnerTeamId = winnerTeamId;
    fixture.status = 'final';
    if (allStageGamesFinal(tournament, store.matches, 'group')) {
      const standings = getTournamentStandings(tournament, store.matches, store.teams);
      const finalFixture = tournament.rounds.flatMap(item => item.fixtures).find(item => item.stage === 'final');
      const finalRound = tournament.rounds.find(item => item.fixtures.includes(finalFixture));
      finalFixture.homeTeamId = standings[0]?.teamId || null;
      finalFixture.awayTeamId = standings[1]?.teamId || null;
      if (!finalFixture.homeTeamId || !finalFixture.awayTeamId) throw new Error('No se pudo determinar la final del cuadrangular.');
      tournamentMatch(tournament, finalRound, finalFixture, store.teams, store.matches);
    }
    return tournament;
  }

  if (match.tournamentStage === 'final') {
    fixture.winnerTeamId = winnerTeamId;
    fixture.status = 'final';
    tournament.status = 'completed';
    tournament.championTeamId = winnerTeamId;
    tournament.finishedAt = new Date().toISOString();
    return tournament;
  }

  if (tournament.format === 'playoff') {
    fixture.wins[winnerTeamId] = (fixture.wins[winnerTeamId] || 0) + 1;
    if (fixture.wins[winnerTeamId] < 2) {
      tournamentMatch(tournament, round, fixture, store.teams, store.matches);
      return tournament;
    }
  }

  fixture.winnerTeamId = winnerTeamId;
  fixture.status = 'final';
  placeWinner(tournament, roundIndex, fixtureIndex, store.teams, store.matches);
  return tournament;
}

async function hashInviteToken(token) {

}

function createInviteCode() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = crypto.getRandomValues(new Uint8Array(12));
  const characters = Array.from(bytes, byte => alphabet[byte % alphabet.length]).join('');
  return `EC-${characters.slice(0, 4)}-${characters.slice(4, 8)}-${characters.slice(8, 12)}`;
}

function normalizeInviteCode(value) {

function escapeAttribute(value) {

}

function stopClock(persist = true) {
  if (clockInterval) clearInterval(clockInterval);
  clockInterval = null;
  const oldMatchId = clockMatchId;
  clockMatchId = null;
  if (persist && oldMatchId) {
    try {
      updateStore(store => {
        const match = store.matches.find(item => item.id === oldMatchId);
        if (match) match.clockRunning = false;
      });
    } catch (error) {
      showToast(error.message, 'error');
    }
  }
}

function startClock(matchId) {
  if (clockInterval && clockMatchId === matchId) return;
  if (clockInterval) stopClock(false);
  clockMatchId = matchId;
  clockInterval = setInterval(() => {
    try {
      let ended = false;
      updateStore(store => {
        const match = store.matches.find(item => item.id === matchId);
        if (!match || match.status !== 'live' || !match.clockRunning) { ended = true; return; }
        if (match.clockSeconds <= 0) { match.clockRunning = false; ended = true; return; }
        match.clockSeconds -= 1;
        for (const line of match.players) if (line.onCourt) line.secondsPlayed += 1;
        if (match.clockSeconds === 0) { match.clockRunning = false; ended = true; }
      }, { sync: false });
      if (currentRoute().name === 'match' && currentRoute().id === matchId) updateClockDisplay(matchId);
      if (ended) {
        stopClock(false);
        showToast('Terminó el tiempo del período. Avanza al siguiente cuarto cuando estés listo.');
      }
    } catch (error) {
      stopClock(false);
      showToast(error.message, 'error');
    }
  }, 1000);
}

function updateClockDisplay(matchId) {
  const store = readStore();
  const match = store.matches.find(item => item.id === matchId);
  if (!match) return;
  const clock = document.querySelector('#match-clock');
  if (clock) clock.textContent = formatClock(match.clockSeconds);
  for (const line of match.players) {
    const minuteLabels = document.querySelectorAll(`[data-player-minutes="${CSS.escape(line.playerId)}"]`);
    const mins = Math.floor(line.secondsPlayed / 60);
    const secs = line.secondsPlayed % 60;
    minuteLabels.forEach(label => { label.textContent = `${mins}:${String(secs).padStart(2, '0')}`; });
  }
  const status = document.querySelector('.clock-state');
  if (status) status.textContent = match.clockRunning ? 'Reloj en marcha' : 'Reloj detenido';
  const toggle = document.querySelector('[data-match-action="toggle-clock"]');
  if (toggle) {
    toggle.textContent = match.clockRunning ? 'Pausar' : 'Iniciar reloj';
    toggle.classList.toggle('button-warning', match.clockRunning);
    toggle.classList.toggle('button-primary', !match.clockRunning);
  }
}

async function readImage(file, maxDimension = 480) {
  if (!file) return '';
  if (!file.type.startsWith('image/')) throw new Error('Selecciona un archivo de imagen válido.');
  if (file.size > 8 * 1024 * 1024) throw new Error('La imagen debe pesar menos de 8 MB.');
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(bitmap.width * scale));
  canvas.height = Math.max(1, Math.round(bitmap.height * scale));
  const context = canvas.getContext('2d');
  context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  return canvas.toDataURL('image/webp', 0.78);
}

    if (duplicate) throw new Error('Ya existe un equipo con ese nombre.');
    if (id) {
      const team = store.teams.find(item => item.id === id);
      if (!team) throw new Error('El equipo que intentas editar ya no existe.');
      Object.assign(team, { name, city, color, logo, updatedAt: new Date().toISOString() });
    } else {
      store.teams.push({ id: makeId('team'), name, city, color, logo, createdAt: new Date().toISOString() });
    }
  });
  navigate('#teams');
  showToast(id ? 'Equipo actualizado' : 'Equipo creado');
}

async function submitPlayerForm(form) {
  const values = new FormData(form);
  const id = form.dataset.id;
  const name = String(values.get('name') || '').trim();
  const teamId = String(values.get('teamId') || '');
  const number = Number(values.get('number'));
  const position = String(values.get('position') || '');
  const ageValue = String(values.get('age') || '').trim();
  const heightValue = String(values.get('heightCm') || '').trim();
  if (!name || !teamId || !position || !Number.isInteger(number) || number < 0 || number > 99) {
    throw new Error('Completa nombre, equipo, posición y un dorsal entre 0 y 99.');
  }
  const file = values.get('photo');
  const storeBefore = readStore();
  if (!storeBefore.teams.some(team => team.id === teamId)) throw new Error('Selecciona un equipo existente.');
  const duplicate = storeBefore.players.find(player => player.id !== id && player.teamId === teamId && Number(player.number) === number);
  if (duplicate) throw new Error(`El dorsal ${number} ya está asignado en ese equipo.`);
  const old = storeBefore.players.find(player => player.id === id);
  const photo = file?.size ? await readImage(file, 520) : (old?.photo || '');
  const playerData = {
    name, teamId, number, position,
    age: ageValue ? Number(ageValue) : null,
    heightCm: heightValue ? Number(heightValue) : null,
    photo
  };
  updateStore(store => {
    if (id) {
      const player = store.players.find(item => item.id === id);
      if (!player) throw new Error('El jugador que intentas editar ya no existe.');
      Object.assign(player, playerData, { updatedAt: new Date().toISOString() });
    } else {
      store.players.push({ id: makeId('player'), ...playerData, createdAt: new Date().toISOString() });
    }
  });
  navigate('#players');
  showToast(id ? 'Jugador actualizado' : 'Jugador creado');
}

function submitMatchForm(form) {
  const values = new FormData(form);
  const match = newMatch({
    homeTeamId: String(values.get('homeTeamId') || ''),
    awayTeamId: String(values.get('awayTeamId') || ''),
    date: String(values.get('date') || '')
  }, readStore().teams);
  updateStore(store => store.matches.push(match));
  navigate('#matches');
  showToast('Partido creado. Revisa las plantillas y pulsa Iniciar partido.');
}

function submitTournamentForm(form) {
  const values = new FormData(form);
  const store = readStore();
  const { tournament, matches } = createTournament({
    name: String(values.get('name') || ''),
    format: String(values.get('format') || ''),
    teamIds: values.getAll('teamIds').map(String),
    date: String(values.get('date') || '')
  }, store.teams);
  updateStore(data => {
    data.tournaments.push(tournament);
    data.matches.push(...matches);
  });
  navigate(`#tournament/${tournament.id}`);
  showToast(`Torneo creado con ${matches.length} partido${matches.length === 1 ? '' : 's'} programado${matches.length === 1 ? '' : 's'}.`);
}

async function onSubmit(event) {
  const authForm = event.target.closest('form[data-auth-form]');
  if (authForm) {
    event.preventDefault();
    await handleAuthForm(authForm);
    return;
  }
  const form = event.target.closest('form[data-form]');
  if (!form) return;
  event.preventDefault();
  setFormMessage(form, '');
  try {
    if (form.dataset.form === 'team') await submitTeamForm(form);
    if (form.dataset.form === 'player') await submitPlayerForm(form);
    if (form.dataset.form === 'match') submitMatchForm(form);
    if (form.dataset.form === 'tournament') submitTournamentForm(form);
    if (form.dataset.form === 'workspace-create') await submitWorkspaceCreate(form);
    if (form.dataset.form === 'workspace-join') await submitWorkspaceJoin(form);
    if (form.dataset.form === 'workspace-invite') await submitWorkspaceInvite(form);

    setFormMessage(form, error.message || 'No se pudo guardar. Revisa los datos e inténtalo otra vez.', true);

function handleStartMatch(matchId) {
  try {
    updateStore(store => {
      const match = store.matches.find(item => item.id === matchId);
      if (!match) throw new Error('No encontramos ese partido.');
      startMatch(match, store.teams, store.players);
    });
    navigate(`#match/${matchId}`);
    showToast('Partido iniciado. El marcador está listo.');
  } catch (error) {
    showToast(error.message, 'error');
  }
}

function handleMatchAction(matchId, action) {
  try {
    if (action === 'toggle-clock') {
      let running;
      updateStore(store => {
        const match = store.matches.find(item => item.id === matchId);
        if (!match || match.status !== 'live') throw new Error('El partido no está en curso.');
        match.clockRunning = !match.clockRunning;
        running = match.clockRunning;
      });
      if (running) startClock(matchId);
      else stopClock(false);
      renderRoute();
      return;
    }
    if (action === 'undo') {
      let undone = false;
      updateStore(store => {
        const match = store.matches.find(item => item.id === matchId);
        if (!match) throw new Error('No encontramos ese partido.');
        undone = undoLastAction(match);
      });
      renderRoute();
      showToast(undone ? 'Última acción deshecha' : 'No hay acciones para deshacer', undone ? 'success' : 'info');
      return;
    }
    if (action === 'next-quarter' || action === 'previous-quarter') {
      stopClock(true);
      updateStore(store => {
        const match = store.matches.find(item => item.id === matchId);
        if (!match) throw new Error('No encontramos ese partido.');
        advanceQuarter(match, action === 'next-quarter' ? 1 : -1);
        match.clockRunning = false;
      });
      renderRoute();
      return;
    }
    if (action === 'finish') {
      if (!window.confirm('¿Finalizar este partido? Las estadísticas quedarán guardadas en el historial del jugador.')) return;
      stopClock(false);
      updateStore(store => {
        const match = store.matches.find(item => item.id === matchId);
        if (!match) throw new Error('No encontramos ese partido.');
        finalizeMatch(match);
        if (match.tournamentId) updateTournamentAfterMatch(store, match);
      });
      renderRoute();
      showToast('Partido finalizado. Las estadísticas ya están en el historial y el torneo se actualizó.');
    }
  } catch (error) {
    showToast(error.message, 'error');
  }
}

function onClick(event) {
  const authModeButton = event.target.closest('[data-auth-mode]');
  if (authModeButton) {
    authMode = authModeButton.dataset.authMode;
    setGateMessage('');
    renderRoute();
    return;
  }

  const authAction = event.target.closest('[data-auth-action]');
  if (authAction) {
    const action = authAction.dataset.authAction;
    if (action === 'sign-out') {
      void supabase.auth.signOut().then(({ error }) => {
        if (error) showToast(error.message, 'error');
      });
    } else if (action === 'switch-workspace') {
      activeWorkspace = null;
      workspaceMembers = [];
      deactivateWorkspaceStore();
      renderRoute();
    } else if (action === 'copy-invite') {
      const link = document.querySelector('#invite-link')?.value;
      if (link) navigator.clipboard.writeText(link).then(() => showToast('Enlace copiado')).catch(() => showToast('Selecciona y copia el enlace manualmente.', 'info'));
    } else if (action === 'copy-invite-code') {
      const code = document.querySelector('#invite-code')?.value;
      if (code) navigator.clipboard.writeText(code).then(() => showToast('Código copiado')).catch(() => showToast('Selecciona y copia el código manualmente.', 'info'));
    }
    return;
  }

  const workspaceButton = event.target.closest('[data-open-workspace]');
  if (workspaceButton) {
    void selectWorkspace(workspaceButton.dataset.openWorkspace);
    return;
  }

  const navLink = event.target.closest('.nav-link');
  if (navLink) {
    document.querySelector('.app-shell')?.classList.remove('menu-open');
    const menuButton = document.querySelector('[data-action="toggle-menu"]');
    menuButton?.setAttribute('aria-expanded', 'false');
    menuButton?.setAttribute('aria-label', 'Abrir menú');
    return;
  }

  const startButton = event.target.closest('[data-action="start-match"]');
  if (startButton) { handleStartMatch(startButton.dataset.id); return; }

  const selectButton = event.target.closest('[data-select-player]');
  if (selectButton) {
    const playerId = selectButton.dataset.selectPlayer;
    try {
      updateStore(store => {
        const match = store.matches.find(item => item.id === currentRoute().id);
        if (!match || match.status !== 'live') throw new Error('El partido no está en curso.');
        if (!match.players.some(player => player.playerId === playerId)) throw new Error('Jugador no disponible en este partido.');
        match.selectedPlayerId = playerId;
      });
      renderRoute();
    } catch (error) { showToast(error.message, 'error'); }
    return;
  }

  const toggleLineup = event.target.closest('[data-toggle-lineup]');
  if (toggleLineup) {
    try {
      updateStore(store => {
        const match = store.matches.find(item => item.id === currentRoute().id);
        if (!match) throw new Error('No encontramos ese partido.');
        toggleOnCourt(match, toggleLineup.dataset.toggleLineup);
      });
      renderRoute();
    } catch (error) { showToast(error.message, 'error'); }
    return;
  }

  const statButton = event.target.closest('[data-stat-action]');
  if (statButton) {
    try {
      updateStore(store => {
        const match = store.matches.find(item => item.id === currentRoute().id);
        if (!match) throw new Error('No encontramos ese partido.');
        recordAction(match, statButton.dataset.statAction, match.selectedPlayerId);
      });
      renderRoute();
    } catch (error) { showToast(error.message, 'error'); }
    return;
  }

  const matchButton = event.target.closest('[data-match-action]');
  if (matchButton) { handleMatchAction(currentRoute().id, matchButton.dataset.matchAction); return; }

  const menuButton = event.target.closest('[data-action="toggle-menu"]');
  if (menuButton) {
    const isOpen = document.querySelector('.app-shell')?.classList.toggle('menu-open') || false;
    menuButton.setAttribute('aria-expanded', String(isOpen));
    menuButton.setAttribute('aria-label', isOpen ? 'Cerrar menú' : 'Abrir menú');
  }
}

function handleRouteChange() {
  const route = currentRoute();
  if (clockInterval && (route.name !== 'match' || route.id !== clockMatchId)) stopClock(true);
  renderRoute();
  if (route.name === 'account' && activeWorkspace) void refreshWorkspaceMembers();

window.addEventListener('ec:workspace-conflict', () => {
  if (activeWorkspace) renderRoute();
});

app.addEventListener('click', onClick);
app.addEventListener('submit', onSubmit);
window.addEventListener('hashchange', handleRouteChange);
window.addEventListener('pagehide', () => stopClock(true));

void initializeAuthentication();
